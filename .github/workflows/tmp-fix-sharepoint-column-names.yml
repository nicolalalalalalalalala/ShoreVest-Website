name: Temporary Fix SharePoint Column Names

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-fix-sharepoint-column-names.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Shorten SharePoint internal column names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'ApplicationReceivedNotificationState': 'AppRecvNotificationState',
              'ApplicationReceivedNotificationEventKey': 'AppRecvNotificationEventKey',
              'ApplicationReceivedNotificationSentAtUtc': 'AppRecvNotificationSentAtUtc',
              'ApplicationReceivedNotificationAttemptCount': 'AppRecvNotificationAttemptCount',
              'ApplicationReceivedNotificationLastErrorCode': 'AppRecvNotificationLastErrorCode',
              'DocumentsReadyNotificationState': 'DocsReadyNotificationState',
              'DocumentsReadyNotificationEventKey': 'DocsReadyNotificationEventKey',
              'DocumentsReadyNotificationSentAtUtc': 'DocsReadyNotificationSentAtUtc',
              'DocumentsReadyNotificationAttemptCount': 'DocsReadyNotificationAttemptCount',
              'DocumentsReadyNotificationLastErrorCode': 'DocsReadyNotificationLastErrorCode',
          }

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          graph = Path('services/recruitment-functions/src/adapters/graph.js')
          text = graph.read_text(encoding='utf-8')
          text = text.replace("  'ApplicationReceived',\n  'DocumentsReady'", "  'AppRecv',\n  'DocsReady'")
          graph.write_text(text, encoding='utf-8')

          dispatcher = Path('services/recruitment-functions/src/outbox/dispatcher.js')
          text = dispatcher.read_text(encoding='utf-8')
          text = text.replace("setNotificationState(fields, 'ApplicationReceived', event)", "setNotificationState(fields, 'AppRecv', event)")
          text = text.replace("setNotificationState(fields, 'DocumentsReady', event)", "setNotificationState(fields, 'DocsReady', event)")
          text = text.replace("clearNotificationState(fields, 'ApplicationReceived')", "clearNotificationState(fields, 'AppRecv')")
          text = text.replace("clearNotificationState(fields, 'DocumentsReady')", "clearNotificationState(fields, 'DocsReady')")
          dispatcher.write_text(text, encoding='utf-8')

          validator = Path('services/recruitment-functions/scripts/validate-sharepoint-schema.js')
          text = validator.read_text(encoding='utf-8')
          needle = "    if (!column.name || !column.type) fail(`${list.name} contains a column without name/type`);\n"
          insertion = needle + "    if (column.name.length > 32) fail(`${list.name}.${column.name} exceeds the SharePoint list internal-name limit`);\n"
          if 'exceeds the SharePoint list internal-name limit' not in text:
              text = text.replace(needle, insertion)
          validator.write_text(text, encoding='utf-8')

          Path('.github/workflows/tmp-fix-sharepoint-column-names.yml').unlink()
          PY

      - name: Commit corrected schema and runtime mapping
        shell: bash
        run: |
          git config user.name "shorevest-recruitment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix SharePoint list internal column names"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
