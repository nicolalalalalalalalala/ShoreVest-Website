name: Validate production legacy redirects once

on:
  push:
    branches:
      - fix/production-legacy-redirects-20260820
    paths:
      - '.github/workflows/validate-production-legacy-redirects-once.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-legacy-redirects-20260820

      - name: Validate router syntax and all mappings
        run: |
          node --check assets/js/legacy-404-redirects.js
          python - <<'PY'
          from pathlib import Path
          import re

          router = Path('assets/js/legacy-404-redirects.js').read_text(encoding='utf-8')
          page404 = Path('404.html').read_text(encoding='utf-8')
          pairs = re.findall(r"^\s*'([^']+)':\s*'([^']+)',?\s*$", router, flags=re.M)
          mapping = dict(pairs)

          assert len(pairs) == len(mapping), 'Duplicate legacy path keys found'
          assert len(mapping) >= 90, f'Unexpectedly small map: {len(mapping)}'
          assert '/wp-login.php' not in mapping, 'Bot login path must remain a genuine 404'
          assert "path.indexOf(" not in router, 'Broad prefix wildcard logic must not be present'
          assert "^\\/20\\d" not in router, 'Broad date wildcard logic must not be present'
          assert '/assets/js/legacy-404-redirects.js?v=20260820-production' in page404
          assert page404.index('/assets/js/legacy-404-redirects.js?v=20260820-production') < page404.index('googletagmanager.com'), 'Router must run before GA'
          assert '(window.location.search || \'\') + (window.location.hash || \'\')' in router, 'Router must preserve query/hash'

          missing_targets = []
          bad_stubs = []
          filelike = []
          stubbed = 0

          def target_file(target):
              if target == '/':
                  return Path('index.html')
              clean = target.split('#', 1)[0].split('?', 1)[0].lstrip('/')
              if target.split('#', 1)[0].endswith('/'):
                  return Path(clean) / 'index.html'
              return Path(clean)

          for old, target in mapping.items():
              tf = target_file(target)
              if not tf.exists():
                  missing_targets.append((old, target, str(tf)))

              rel = old.lstrip('/')
              suffix = Path(rel).suffix.lower()
              if suffix and suffix != '.html':
                  filelike.append(old)
                  continue

              stub = Path(rel) if suffix == '.html' else Path(rel) / 'index.html'
              if not stub.exists():
                  bad_stubs.append((old, 'missing stub', str(stub)))
                  continue
              body = stub.read_text(encoding='utf-8', errors='replace')
              if 'Redirecting | ShoreVest' not in body or target not in body:
                  bad_stubs.append((old, 'stub does not point to expected target', str(stub)))
              else:
                  stubbed += 1

          if missing_targets:
              raise SystemExit('Missing destinations:\n' + '\n'.join(map(str, missing_targets)))
          if bad_stubs:
              raise SystemExit('Bad redirect stubs:\n' + '\n'.join(map(str, bad_stubs)))

          # Known key routes must be present explicitly.
          expected = {
              '/news-insights': '/insights/',
              '/john-jones': '/team/',
              '/benjamin-fanger': '/team/',
              '/china-debt-dynamics-v9i3': '/insights/china-debt-dynamics/v9i3/',
              '/apply.html': '/careers/',
              '/about-shorevest-partners': '/firm/',
              '/shoraccess': '/investor-portal/',
          }
          for old, target in expected.items():
              assert mapping.get(old) == target, f'{old} expected {target}, got {mapping.get(old)}'

          report = (
              'PASS\n'
              f'exact_mappings={len(mapping)}\n'
              f'static_redirect_pages_validated={stubbed}\n'
              f'filelike_404_router_fallbacks={len(filelike)}\n'
              'all_destinations_exist=yes\n'
              'router_before_google_analytics=yes\n'
              'wp_login_remains_404=yes\n'
              'broad_wildcards_present=no\n'
              'query_and_hash_preserved=yes\n'
          )
          Path('redirect-validation-report.txt').write_text(report, encoding='utf-8')
          print(report)
          PY

      - name: Commit validation report and remove one-time workflow
        run: |
          rm -f .github/workflows/validate-production-legacy-redirects-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record production redirect validation"
          git push origin HEAD:fix/production-legacy-redirects-20260820
