name: Apply Strategy hero image update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-strategy-hero.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add one-time Strategy hero updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Strategy hero and cache bust
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/css/visual-review-overrides.css')
          s = css.read_text()
          old = 'background: url("/assets/img/trees/home-hero-max-zhang.jpg?v=20260730-strategy-hero-final") center / cover no-repeat !important;'
          new = 'background: url("/yang-miao-YUJNtZS8n5o-unsplash.jpg?v=20260805-strategy-hero-yang-miao-1") center / cover no-repeat !important;'
          if old not in s:
              raise SystemExit('Expected current Strategy hero rule not found')
          s = s.replace('/* Strategy hero uses the former homepage hero photograph. */', '/* Strategy hero uses the requested Yang Miao photograph. */')
          s = s.replace(old, new, 1)
          css.write_text(s)

          for name in ['strategy/index.html', 'cn/strategy/index.html']:
              p = Path(name)
              t = p.read_text()
              oldv = '/assets/css/visual-review-overrides.css?v=20260801-typography-fix-1'
              newv = '/assets/css/visual-review-overrides.css?v=20260805-strategy-hero-yang-miao-1'
              if oldv not in t:
                  raise SystemExit(f'Expected visual override version not found in {name}')
              p.write_text(t.replace(oldv, newv, 1))
          PY
          git rm .github/workflows/apply-strategy-hero.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/visual-review-overrides.css strategy/index.html cn/strategy/index.html
          git commit -m 'Update Strategy hero to Yang Miao'
          git push origin HEAD:main
