name: One-time homepage hero update

on:
  push:
    paths:
      - '.github/workflows/one-time-update-homepage-hero.yml'

permissions:
  contents: write

jobs:
  update-homepage-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace homepage hero image
        shell: bash
        run: |
          set -euo pipefail
          old='assets/img/trees/home-hero-metasequoia-sq.jpg'
          new='max-zhang-n49ciNUwej8-unsplash.jpg'

          for file in index.html cn/index.html home.html home_cn.html; do
            if [ -f "$file" ]; then
              sed -i "s|$old|$new|g" "$file"
            fi
          done

          rm -f .github/workflows/one-time-update-homepage-hero.yml

      - name: Commit homepage hero update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cn/index.html home.html home_cn.html .github/workflows/one-time-update-homepage-hero.yml
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Update homepage hero image"
          git push origin main
