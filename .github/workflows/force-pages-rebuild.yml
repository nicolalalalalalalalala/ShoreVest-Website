name: Force live GitHub Pages rebuild

# Trigger refreshed after production legacy redirect merge on 2026-08-20.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-pages-rebuild.yml"

permissions:
  contents: write
  pages: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Force live ShoreVest Pages rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force and verify Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          request_http=$(curl -sS -o /tmp/request.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/pages/builds")
          status=unknown
          latest_http=0
          commit=''
          error=''
          for i in $(seq 1 24); do
            latest_http=$(curl -sS -o /tmp/latest.json -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPOSITORY}/pages/builds/latest")
            status=$(python - <<'PY'
import json
try:
    d=json.load(open('/tmp/latest.json'))
    print(d.get('status','unknown'))
except Exception:
    print('unknown')
PY
)
            commit=$(python - <<'PY'
import json
try:
    d=json.load(open('/tmp/latest.json'))
    print(d.get('commit',''))
except Exception:
    print('')
PY
)
            error=$(python - <<'PY'
import json
try:
    d=json.load(open('/tmp/latest.json'))
    print((d.get('error') or {}).get('message','') if isinstance(d.get('error'),dict) else (d.get('error') or ''))
except Exception:
    print('')
PY
)
            [ "$status" = built ] && break
            [ "$status" = errored ] && break
            sleep 5
          done
          printf 'request_http=%s\nlatest_http=%s\nstatus=%s\ncommit=%s\nerror=%s\nchecked_at=%s\n' "$request_http" "$latest_http" "$status" "$commit" "$error" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > live-pages-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-pages-build-status.txt
          git commit -m 'Record live Pages rebuild status' || exit 0
          git push
