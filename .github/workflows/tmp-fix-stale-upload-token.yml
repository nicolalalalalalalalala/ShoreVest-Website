name: Temporary fix stale upload token validation

on:
  push:
    branches:
      - agent/recruitment-frontend-launch
    paths:
      - .github/workflows/tmp-fix-stale-upload-token.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recruitment-frontend-launch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require current upload credential generation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/recruitment/core/flows.js')
          s = p.read_text(encoding='utf-8')
          old = "if (payload.credentialGeneration > file.credentialGeneration) return false;"
          new = "if (payload.credentialGeneration !== file.credentialGeneration) return false;"
          if old not in s:
              if new in s:
                  print('Strict generation check already present')
              else:
                  raise SystemExit('Expected credential-generation check not found')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          npm ci --ignore-scripts
          node tests/recruitment-phase2a3.test.js
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "shorevest-recruitment-bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/tmp-fix-stale-upload-token.yml
          git add api/recruitment/core/flows.js .github/workflows/tmp-fix-stale-upload-token.yml
          git commit -m "Reject stale recruitment upload completion tokens"
          git push origin HEAD:agent/recruitment-frontend-launch
