name: Temporary Disable Key Vault Secret Access in Foundation

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/tmp-disable-keyvault-secret-access-foundation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-recruitment-backend
          fetch-depth: 0

      - name: Make Key Vault secret access explicit opt-in
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('infra/recruitment/main.bicep')
          text = path.read_text()

          param_anchor = "@description('Paid Microsoft Defender for Storage malware scanning. Explicit opt-in only.')\nparam enableDefenderForStorage bool = false\n"
          param_insert = "@description('Grant the managed identity Key Vault Secrets User access. Enable only when secret values and the backend package are being configured.')\nparam enableKeyVaultSecretAccess bool = false\n\n" + param_anchor
          if text.count(param_anchor) != 1:
              raise SystemExit(f'Expected exactly one parameter anchor, found {text.count(param_anchor)}')
          text = text.replace(param_anchor, param_insert)

          old_resource = "resource kvSecrets 'Microsoft.Authorization/roleAssignments@2022-04-01' = {"
          new_resource = "resource kvSecrets 'Microsoft.Authorization/roleAssignments@2022-04-01' = if (enableKeyVaultSecretAccess) {"
          if text.count(old_resource) != 1:
              raise SystemExit(f'Expected exactly one Key Vault role resource, found {text.count(old_resource)}')
          text = text.replace(old_resource, new_resource)

          path.write_text(text)
          PY

          git diff --check
          git diff --exit-code -- infra/recruitment/main.bicep && {
            echo 'Patch produced no change.' >&2
            exit 1
          }

          git config user.name 'shorevest-recruitment-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add infra/recruitment/main.bicep
          git commit -m 'Make Key Vault secret access an explicit opt-in'
          git push origin HEAD:agent/rebuild-recruitment-backend
