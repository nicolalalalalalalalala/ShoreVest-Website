name: Apply China team visual review

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-visual-review-20260730.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load the review stylesheet on every public page
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260730-visual-review-1'
          link = f'<link rel="stylesheet" href="/assets/css/visual-review-overrides.css?v={version}" data-sv-visual-review="direct">'
          changed = []
          checked = []

          for path in sorted(Path('.').rglob('*.html')):
              if any(part in {'.git', 'node_modules', 'coverage', 'playwright-report', 'test-results'} for part in path.parts):
                  continue

              text = path.read_text(encoding='utf-8')
              if not re.search(r'<body\b[^>]*class=["\'][^"\']*\bhomepage\b', text, re.I):
                  continue

              checked.append(path)
              new = re.sub(
                  r'<link\s+rel=["\']stylesheet["\']\s+href=["\']/assets/css/visual-review-overrides\.css\?v=[^"\']+["\']\s+data-sv-visual-review=["\']direct["\']>',
                  link,
                  text,
                  flags=re.I,
              )

              if 'data-sv-visual-review="direct"' not in new:
                  if '</head>' not in new:
                      raise SystemExit(f'Missing </head>: {path}')
                  new = new.replace('</head>', link + '\n</head>', 1)

              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path)

          if not checked:
              raise SystemExit('No public homepage-shell pages found')

          failures = []
          for path in checked:
              text = path.read_text(encoding='utf-8')
              if link not in text:
                  failures.append(str(path))

          if failures:
              raise SystemExit('Visual review stylesheet missing from:\n' + '\n'.join(failures))

          print(f'Validated {len(checked)} public pages; updated {len(changed)}.')
          for path in changed:
              print(path)
          PY

      - name: Verify requested assets and rules
        run: |
          set -euo pipefail
          test -s assets/img/trees/home-hero-max-zhang.jpg
          test -s assets/css/visual-review-overrides.css
          grep -q 'font-size: 14px' assets/css/visual-review-overrides.css
          grep -q 'clamp(17px, 1.15vw, 18px)' assets/css/visual-review-overrides.css
          grep -q 'filter: none' assets/css/visual-review-overrides.css
          grep -q '/assets/img/trees/home-hero-max-zhang.jpg' assets/css/visual-review-overrides.css

      - name: Commit the rollout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'All public pages already load the visual review stylesheet.'
            exit 0
          fi
          git commit -m 'Load China team visual review across public pages'
          git push
