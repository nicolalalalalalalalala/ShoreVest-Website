name: Verify plain homepage scrolling
on:
  push:
    paths:
      - '.github/workflows/verify-plain-homepage-scroll.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sleep 20
      - run: npm install playwright-core
      - name: Test plain public URL
        run: |
          CHROME=$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)
          export CHROME
          node <<'JS'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            await page.goto('https://shorevest.com/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.evaluate(() => scrollTo(0, 0));
            const before = await page.evaluate(() => ({
              y: scrollY,
              max: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) - innerHeight,
              guardLoaded: !!document.querySelector('script[src*="chrome-scroll-guard.js"]'),
              rootOverflowY: getComputedStyle(document.documentElement).overflowY,
              bodyOverflowY: getComputedStyle(document.body).overflowY,
              bodyPosition: getComputedStyle(document.body).position
            }));
            await page.mouse.move(600, 400);
            await page.mouse.wheel(0, 700);
            await page.waitForTimeout(700);
            const afterWheel = await page.evaluate(() => scrollY);
            const result = {
              checkedAt: new Date().toISOString(),
              url: page.url(),
              userAgent: await page.evaluate(() => navigator.userAgent),
              before,
              afterWheel,
              passed: before.guardLoaded && before.max > 0 && afterWheel > 0
            };
            fs.writeFileSync('chrome-scroll-plain-url-result.json', JSON.stringify(result, null, 2) + '\n');
            await browser.close();
            if (!result.passed) process.exitCode = 1;
          })().catch(e => {
            fs.writeFileSync('chrome-scroll-plain-url-result.json', JSON.stringify({passed:false,error:String(e&&e.stack||e)},null,2)+'\n');
            process.exitCode=1;
          });
          JS
      - name: Publish result
        if: always()
        run: |
          rm -f .github/workflows/verify-plain-homepage-scroll.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Record plain homepage Chrome scroll verification"
          git pull --rebase origin main
          git push