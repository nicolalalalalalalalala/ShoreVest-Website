name: Temporary Trim Recruitment Route Diff

on:
  push:
    branches:
      - agent/fix-recruitment-apply-route

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-recruitment-apply-route
          fetch-depth: 0

      - name: Keep only the intended recruitment routing changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keep/careers/apply" "$RUNNER_TEMP/keep/cn/careers/apply" "$RUNNER_TEMP/keep/assets/data" "$RUNNER_TEMP/keep/scripts"
          cp scripts/generate-clean-public-urls.js "$RUNNER_TEMP/keep/scripts/generate-clean-public-urls.js"
          cp assets/data/clean-url-manifest.json "$RUNNER_TEMP/keep/assets/data/clean-url-manifest.json"
          cp careers/apply/index.html "$RUNNER_TEMP/keep/careers/apply/index.html"
          cp cn/careers/apply/index.html "$RUNNER_TEMP/keep/cn/careers/apply/index.html"

          git fetch --no-tags origin main
          git checkout origin/main -- .

          cp "$RUNNER_TEMP/keep/scripts/generate-clean-public-urls.js" scripts/generate-clean-public-urls.js
          cp "$RUNNER_TEMP/keep/assets/data/clean-url-manifest.json" assets/data/clean-url-manifest.json
          cp "$RUNNER_TEMP/keep/careers/apply/index.html" careers/apply/index.html
          cp "$RUNNER_TEMP/keep/cn/careers/apply/index.html" cn/careers/apply/index.html

          git rm .github/workflows/tmp-trim-recruitment-route-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Trim recruitment route fix to intended files"
          git push origin HEAD:agent/fix-recruitment-apply-route
