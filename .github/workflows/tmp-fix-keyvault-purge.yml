name: Temporary Key Vault Purge Protection Fix

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/tmp-fix-keyvault-purge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-recruitment-backend
          fetch-depth: 0

      - name: Patch Key Vault purge protection handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('infra/recruitment/main.bicep')
          text = path.read_text()
          old = """  properties: {
            tenantId: tenant().tenantId
            sku: {
              family: 'A'
              name: 'standard'
            }
            enableRbacAuthorization: true
            enabledForTemplateDeployment: false
            enableSoftDelete: true
            softDeleteRetentionInDays: 90
            enablePurgeProtection: environmentName == 'prod'
            publicNetworkAccess: 'Enabled'
          }
          """
          new = """  properties: union({
            tenantId: tenant().tenantId
            sku: {
              family: 'A'
              name: 'standard'
            }
            enableRbacAuthorization: true
            enabledForTemplateDeployment: false
            enableSoftDelete: true
            softDeleteRetentionInDays: 90
            publicNetworkAccess: 'Enabled'
          }, environmentName == 'prod' ? {
            enablePurgeProtection: true
          } : {})
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Key Vault block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

          git diff --check
          git diff --exit-code -- infra/recruitment/main.bicep && {
            echo 'Patch produced no change.' >&2
            exit 1
          }

          git config user.name 'shorevest-recruitment-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add infra/recruitment/main.bicep
          git commit -m 'Omit disabled Key Vault purge protection in test'
          git push origin HEAD:agent/rebuild-recruitment-backend
