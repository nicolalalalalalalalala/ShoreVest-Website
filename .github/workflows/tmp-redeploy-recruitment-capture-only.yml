name: Temporary Recruitment Capture-Only Redeploy

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/tmp-redeploy-recruitment-capture-only.yml

permissions:
  id-token: write
  contents: write

concurrency:
  group: recruitment-capture-only-redeploy
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP: svrc26hk-recruit-fn-test

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: recruitment-test
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/recruitment-functions/package-lock.json

      - id: login
        name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - id: safety
        name: Verify capture-only safety state
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(az account show --query id -o tsv)" == "$AZURE_SUBSCRIPTION_ID" ]]
          [[ "$(az account show --query tenantId -o tsv)" == "$AZURE_TENANT_ID" ]]
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          value() { jq -r --arg key "$1" '.[] | select(.name == $key) | .value' <<<"$settings" | tr '[:upper:]' '[:lower:]'; }
          [[ "$(value RECRUITMENT_API_ENABLED)" == 'true' ]] || { echo 'Public capture API is not currently enabled.' >&2; exit 1; }
          [[ "$(value RECRUITMENT_CAPTURE_ONLY_MODE)" == 'true' ]] || { echo 'Capture-only mode is not currently enabled.' >&2; exit 1; }
          for key in RECRUITMENT_OUTBOX_DELIVERY_ENABLED RECRUITMENT_CANDIDATE_ACK_ENABLED RECRUITMENT_HR_ACCESS_ENABLED RECRUITMENT_RETENTION_ENABLED RECRUITMENT_RETENTION_DELETION_ENABLED; do
            [[ "$(value "$key")" == 'false' ]] || { echo "$key must remain false." >&2; exit 1; }
          done

      - id: manifest
        name: Verify single controlled role
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const m = require('./assets/data/recruitment/roles.v1.json');
          const enabled = m.roles.filter(r => r.application && r.application.enabled === true);
          if (enabled.length !== 1 || enabled[0].id !== 'legal-assistant' || enabled[0].application.privacyNoticeVersion !== '2026-08-08-v1') {
            throw new Error('Controlled role manifest is not in the expected state');
          }
          NODE

      - id: package
        name: Build immutable Function package
        shell: pwsh
        run: |
          ./services/recruitment-functions/scripts/package.ps1 -CommitSha '${{ github.sha }}' -OutputPath "$env:RUNNER_TEMP/recruitment-functions.zip"

      - id: deploy
        name: Deploy Function package
        shell: bash
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --src "$RUNNER_TEMP/recruitment-functions.zip" \
            --build-remote false \
            --timeout 600 \
            --output none

      - id: index
        name: Verify Functions indexed
        shell: bash
        run: |
          set -euo pipefail
          expected=(initiateApplication completeUpload finalizeApplication health)
          for attempt in $(seq 1 20); do
            names="$(az functionapp function list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --query '[].name' -o tsv 2>/dev/null | sed 's#^.*/##' || true)"
            missing=0
            for name in "${expected[@]}"; do grep -qx "$name" <<<"$names" || missing=$((missing+1)); done
            if [[ "$missing" == 0 ]]; then exit 0; fi
            sleep 15
          done
          exit 1

      - id: health
        name: Verify health and safety after deployment
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 24); do
            code="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "https://${FUNCTION_APP}.azurewebsites.net/api/recruitment/health" || true)"
            if [[ "$code" == '200' ]] && jq -e '.ok == true and .configuration == "valid" and .dependencies == "ready"' "$RUNNER_TEMP/health.json" >/dev/null 2>&1; then healthy=true; break; fi
            sleep 10
          done
          if [[ "$healthy" != 'true' ]]; then
            az functionapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --settings RECRUITMENT_API_ENABLED=false RECRUITMENT_CAPTURE_ONLY_MODE=false --output none || true
            exit 1
          fi
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          value() { jq -r --arg key "$1" '.[] | select(.name == $key) | .value' <<<"$settings" | tr '[:upper:]' '[:lower:]'; }
          [[ "$(value RECRUITMENT_API_ENABLED)" == 'true' ]]
          [[ "$(value RECRUITMENT_CAPTURE_ONLY_MODE)" == 'true' ]]
          for key in RECRUITMENT_OUTBOX_DELIVERY_ENABLED RECRUITMENT_CANDIDATE_ACK_ENABLED RECRUITMENT_HR_ACCESS_ENABLED RECRUITMENT_RETENTION_ENABLED RECRUITMENT_RETENTION_DELETION_ENABLED; do [[ "$(value "$key")" == 'false' ]] || exit 1; done

      - name: Record deployment result on branch
        if: always()
        shell: bash
        env:
          DEPLOYMENT_STATUS: ${{ job.status }}
          OUT_CHECKOUT: ${{ steps.checkout.outcome }}
          OUT_NODE: ${{ steps.node.outcome }}
          OUT_LOGIN: ${{ steps.login.outcome }}
          OUT_SAFETY: ${{ steps.safety.outcome }}
          OUT_MANIFEST: ${{ steps.manifest.outcome }}
          OUT_PACKAGE: ${{ steps.package.outcome }}
          OUT_DEPLOY: ${{ steps.deploy.outcome }}
          OUT_INDEX: ${{ steps.index.outcome }}
          OUT_HEALTH: ${{ steps.health.outcome }}
        run: |
          set -euo pipefail
          cat > recruitment-capture-deployment-status.json <<EOF
          {
            "status": "${DEPLOYMENT_STATUS}",
            "sourceCommit": "${GITHUB_SHA}",
            "functionApp": "${FUNCTION_APP}",
            "recordedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "steps": {
              "checkout": "${OUT_CHECKOUT}",
              "node": "${OUT_NODE}",
              "azureLogin": "${OUT_LOGIN}",
              "safety": "${OUT_SAFETY}",
              "manifest": "${OUT_MANIFEST}",
              "package": "${OUT_PACKAGE}",
              "deploy": "${OUT_DEPLOY}",
              "index": "${OUT_INDEX}",
              "health": "${OUT_HEALTH}"
            }
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recruitment-capture-deployment-status.json
          git commit -m 'Record recruitment capture deployment result [skip ci]' || exit 0
          git push origin HEAD:agent/rebuild-recruitment-backend
