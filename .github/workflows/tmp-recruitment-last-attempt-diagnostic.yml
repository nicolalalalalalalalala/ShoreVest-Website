name: Temporary Recruitment Last Attempt Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-recruitment-last-attempt-diagnostic.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP: svrc26hk-recruit-fn-test

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: recruitment-test
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Read latest recruitment technical states
        shell: bash
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          endpoint="$(jq -r '.[] | select(.name=="RECRUITMENT_COSMOS_ENDPOINT") | .value' <<<"$settings")"
          database="$(jq -r '.[] | select(.name=="RECRUITMENT_COSMOS_DATABASE") | .value' <<<"$settings")"
          account="$(python3 - <<'PY' "$endpoint"
          import sys, urllib.parse
          print(urllib.parse.urlparse(sys.argv[1]).hostname.split('.')[0])
          PY
          )"
          [[ -n "$account" && -n "$database" && "$database" != null ]]
          key="$(az cosmosdb keys list --resource-group "$AZURE_RESOURCE_GROUP" --name "$account" --type keys --query primaryMasterKey -o tsv)"
          [[ -n "$key" ]]

          mkdir -p /tmp/cosmosdiag && cd /tmp/cosmosdiag
          npm init -y >/dev/null 2>&1
          npm install @azure/cosmos@4 --no-audit --no-fund >/dev/null 2>&1
          COSMOS_ENDPOINT="$endpoint" COSMOS_DATABASE="$database" COSMOS_KEY="$key" node <<'NODE'
          const { CosmosClient } = require('@azure/cosmos');
          const client = new CosmosClient({ endpoint: process.env.COSMOS_ENDPOINT, key: process.env.COSMOS_KEY });
          const c = client.database(process.env.COSMOS_DATABASE).container('submissions');
          async function run() {
            const apps = await c.items.query({
              query: `SELECT TOP 8 c.applicationReference, c.roleId, c.technicalStatus, c.submittedAtServerUtc, c.updatedAtUtc, c._ts FROM c WHERE c.docType = 'application' ORDER BY c._ts DESC`
            }, { enableCrossPartitionQuery: true }).fetchAll();
            const files = await c.items.query({
              query: `SELECT TOP 8 c.applicationReference, c.fileReference, c.technicalStatus, c.updatedAtUtc, c._ts FROM c WHERE c.docType = 'file' ORDER BY c._ts DESC`
            }, { enableCrossPartitionQuery: true }).fetchAll();
            console.log('=== LATEST APPLICATION TECHNICAL STATES (no candidate data) ===');
            console.log(JSON.stringify(apps.resources, null, 2));
            console.log('=== LATEST FILE TECHNICAL STATES (no file content/name) ===');
            console.log(JSON.stringify(files.resources, null, 2));
          }
          run().catch((e) => { console.error('DIAGNOSTIC_FAILED', e.code || e.message); process.exit(1); });
          NODE
          unset key
