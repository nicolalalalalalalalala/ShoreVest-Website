name: Temporary Recruitment Last Attempt Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-recruitment-last-attempt-diagnostic.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP: svrc26hk-recruit-fn-test
  STORAGE_ACCOUNT: svrc26hkcvtest
  MANAGED_IDENTITY: svrc26hk-recruit-mi-test

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: recruitment-test
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect recruitment managed identity roles
        shell: bash
        run: |
          set -euo pipefail
          principal="$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name "$MANAGED_IDENTITY" --query principalId -o tsv)"
          storage_id="$(az storage account show --resource-group "$AZURE_RESOURCE_GROUP" --name "$STORAGE_ACCOUNT" --query id -o tsv)"
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          endpoint="$(jq -r '.[] | select(.name=="RECRUITMENT_COSMOS_ENDPOINT") | .value' <<<"$settings")"
          cosmos="$(python3 - <<'PY' "$endpoint"
          import sys, urllib.parse
          print(urllib.parse.urlparse(sys.argv[1]).hostname.split('.')[0])
          PY
          )"

          echo '=== STORAGE ARM/DATA ROLES FOR FUNCTION IDENTITY ==='
          az role assignment list \
            --assignee-object-id "$principal" \
            --scope "$storage_id" \
            --include-inherited \
            --query '[].{role:roleDefinitionName,scope:scope}' \
            -o table

          echo '=== COSMOS SQL DATA ROLES FOR FUNCTION IDENTITY ==='
          az cosmosdb sql role assignment list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --account-name "$cosmos" \
            --query "[?principalId=='$principal'].{roleDefinitionId:roleDefinitionId,scope:scope,principalId:principalId}" \
            -o table || true
