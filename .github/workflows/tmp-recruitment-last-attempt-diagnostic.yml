name: Temporary Recruitment Last Attempt Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-recruitment-last-attempt-diagnostic.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP: svrc26hk-recruit-fn-test
  STORAGE_ACCOUNT: svrc26hkcvtest

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: recruitment-test
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Read recent recruitment request telemetry
        shell: bash
        run: |
          set -euo pipefail
          component="$(az resource list --resource-group "$AZURE_RESOURCE_GROUP" --resource-type 'microsoft.insights/components' --query '[0].name' -o tsv)"
          [[ -n "$component" ]] || { echo 'No Application Insights component found'; exit 2; }
          echo "Application Insights component: $component"

          echo '=== RECENT RECRUITMENT REQUESTS ==='
          az monitor app-insights query \
            --app "$component" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --analytics-query "requests | where timestamp > ago(60m) | where url contains '/api/recruitment/' | project timestamp, name, resultCode, success, url | order by timestamp desc | take 40" \
            -o table || true

          echo '=== RECENT RECRUITMENT TRACES ==='
          az monitor app-insights query \
            --app "$component" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --analytics-query "traces | where timestamp > ago(60m) | where message startswith 'recruitment_' | project timestamp, message, severityLevel | order by timestamp desc | take 40" \
            -o table || true

          echo '=== RECENT TURNSTILE DEPENDENCIES ==='
          az monitor app-insights query \
            --app "$component" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --analytics-query "dependencies | where timestamp > ago(60m) | where target contains 'challenges.cloudflare.com' or name contains 'siteverify' | project timestamp, name, target, resultCode, success, duration | order by timestamp desc | take 20" \
            -o table || true

      - name: Check recent quarantine uploads
        shell: bash
        run: |
          set -euo pipefail
          key="$(az storage account keys list --resource-group "$AZURE_RESOURCE_GROUP" --account-name "$STORAGE_ACCOUNT" --query '[0].value' -o tsv)"
          [[ -n "$key" ]]
          echo '=== RECENT QUARANTINE BLOBS (technical metadata only) ==='
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$key" \
            --container-name recruitment-quarantine \
            --query "sort_by([].{name:name,lastModified:properties.lastModified,size:properties.contentLength,contentType:properties.contentSettings.contentType}, &lastModified)[-8:]" \
            -o table || true
          unset key
