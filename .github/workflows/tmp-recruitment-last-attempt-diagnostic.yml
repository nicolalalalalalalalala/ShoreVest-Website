name: Temporary Recruitment Last Attempt Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-recruitment-last-attempt-diagnostic.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP: svrc26hk-recruit-fn-test
  STORAGE_ACCOUNT: svrc26hkcvtest

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: recruitment-test
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Check recent quarantine uploads with Azure identity
        shell: bash
        run: |
          set -euo pipefail
          echo '=== RECENT QUARANTINE BLOBS (technical metadata only) ==='
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login \
            --container-name recruitment-quarantine \
            --query "sort_by([].{name:name,lastModified:properties.lastModified,size:properties.contentLength,contentType:properties.contentSettings.contentType}, &lastModified)[-8:]" \
            -o table
