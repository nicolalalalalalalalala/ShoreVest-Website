name: Apply approved Simplified Chinese copy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-approved-chinese-copy-20260730.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize approved Chinese mappings and cache keys
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          copy_path = Path('assets/js/chinese-copy-overrides.js')
          copy_text = copy_path.read_text(encoding='utf-8')

          # Preserve the reviewer-approved wording exactly, including spacing.
          replacements = {
              '本投资者门户条款（下称“门户条款”）管辖通过本网站（下称“门户”）访问及使用由新岸资本（ShoreVest Partners, Ltd.）及其相关关联方（统称“ShoreVest”、“我们”或“我们的”）提供的投资者访问门户、受限材料、数据室环境及任何可下载文件的相关事宜。':
              '本投资者门户条款（下称“门户条款”）管辖通过本网站（下称“门户”）访问及使用由新岸资本（ShoreVest Partners, Ltd.） 及其相关关联方（统称“ShoreVest”、“我们”或“我们的”）提供的投资者访问门户、受限材料、数据室环境及任何可下载文件的相关事宜。',
              '本网站由新岸资本及其相关关联方提供，仅供一般参考。内容为概括性质，可能不完整，可能随时变更且恕不另行通知，亦不旨在为评估新岸资本、任何新岸资本管理的载体或任何投资机会提供完整依据。本网站不面向散户投资者。':
              '本网站由新岸资本及其相关关联方提供，仅供一般参考。内容为概括性质，可能不完整，可能随时变更且恕不另行通知，亦不旨在为评估新岸资本、任何 新岸资本管理的载体或任何投资机会提供完整依据。本网站不面向散户投资者。',
          }
          for old, new in replacements.items():
              if old in copy_text:
                  copy_text = copy_text.replace(old, new)
              elif new not in copy_text:
                  raise SystemExit(f'Expected approved mapping source not found: {old[:80]}')

          # The approved media-hero wording is an image alt attribute, not a text
          # node, so apply it explicitly on both canonical and compatibility routes.
          if 'function applyApprovedAttributes()' not in copy_text:
              marker = '  function applyApprovedCopy() {\n'
              insertion = '''  function applyApprovedAttributes() {
            var path = location.pathname.toLowerCase();
            if (/(?:^|\\/)cn\\/media(?:\\/|$)|media_cn\\.html$/.test(path)) {
              var mediaHero = document.querySelector('img[src*="media-hero-fii-priority"]');
              if (mediaHero) {
                mediaHero.alt = "新岸资本在 FII Priority 亚洲峰会的专题讨论中发言，面向与会观众";
              }
            }
          }

'''
              if marker not in copy_text:
                  raise SystemExit('Unable to locate applyApprovedCopy insertion point')
              copy_text = copy_text.replace(marker, insertion + marker, 1)
              copy_text = copy_text.replace(
                  '      applyDirectReplacements(document.body);\n      document.documentElement.setAttribute("data-sv-cn-copy-corrected", "true");',
                  '      applyDirectReplacements(document.body);\n      applyApprovedAttributes();\n      document.documentElement.setAttribute("data-sv-cn-copy-corrected", "true");',
                  1,
              )
              copy_text = copy_text.replace(
                  '    }).catch(function () {\n      applyDirectReplacements(document.body);\n    });',
                  '    }).catch(function () {\n      applyDirectReplacements(document.body);\n      applyApprovedAttributes();\n    });',
                  1,
              )
              copy_text = copy_text.replace(
                  '        if (added.nodeType === 1) applyDirectReplacements(added);',
                  '        if (added.nodeType === 1) {\n          applyDirectReplacements(added);\n          applyApprovedAttributes();\n        }',
                  1,
              )

          copy_path.write_text(copy_text, encoding='utf-8')

          version = '20260730-approved-cn-copy-1'
          guard_path = Path('assets/js/favicon-guard.js')
          guard = guard_path.read_text(encoding='utf-8')
          guard, count = re.subn(
              r'var VERSION = "[^"]+";',
              f'var VERSION = "{version}";',
              guard,
              count=1,
          )
          if count != 1:
              raise SystemExit('Unable to update favicon-guard VERSION')
          guard_path.write_text(guard, encoding='utf-8')

          changed_pages = []
          for path in sorted(Path('.').rglob('*.html')):
              if any(part in {'.git', 'node_modules', 'coverage', 'playwright-report', 'test-results'} for part in path.parts):
                  continue
              # The review workbook explicitly contains no approved page-specific
              # changes for Important Information. Leave those HTML sources alone.
              if 'important-information' in path.as_posix().lower():
                  continue

              text = path.read_text(encoding='utf-8')
              is_chinese = bool(
                  re.search(r'<html\b[^>]*lang=["\']zh', text, re.I)
                  or '/cn/' in path.as_posix().lower()
                  or path.name.lower().endswith('_cn.html')
              )
              if not is_chinese or 'favicon-guard.js' not in text:
                  continue

              updated = re.sub(
                  r'(favicon-guard\.js)\?v=[^"\']+',
                  rf'\1?v={version}',
                  text,
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed_pages.append(path)

          print(f'Updated cache key on {len(changed_pages)} Chinese HTML pages.')
          for path in changed_pages:
              print(path)
          PY

      - name: Validate approved copy implementation
        run: |
          set -euo pipefail
          node --check assets/js/chinese-copy-overrides.js
          node --check assets/js/favicon-guard.js
          python - <<'PY'
          from pathlib import Path

          text = Path('assets/js/chinese-copy-overrides.js').read_text(encoding='utf-8')
          guard = Path('assets/js/favicon-guard.js').read_text(encoding='utf-8')

          # Representative exact pairs cover every approved page group. The full
          # mapping file remains the canonical list created from the reviewed yellow column.
          required = [
              ('ShoreVest Partners and its affiliates provide investment management services to institutional investors.', '新岸资本（ShoreVest Partners）及其关联机构向机构投资者提供投资管理服务。'),
              ('Asset-backed private credit in China', '中国资产支持型私募信贷'),
              ('Institutional experience.', '机构化经验'),
              ('THE OPPORTUNITY', '市场机遇'),
              ('Themes covered', '覆盖主题'),
              ('FEATURED IN', '曾获报道媒体'),
              ('The team behind ShoreVest', '新岸资本团队'),
              ('ShoreVest", "新岸资本', 'ShoreVest", "新岸资本'),
              ('Access Gate Text', '访问准入声明'),
              ('CONTACT', '联系我们'),
              ('Where ShoreVest acts as a data controller', '在新岸资本就本网站担任数据控制者时'),
              ('This Cookie Notice explains how ShoreVest Partners, Ltd.', '本 Cookie 通知说明新岸资本及其相关关联公司'),
              ('These Terms of Use govern your access', '本使用条款规定您对新岸资本及其相关关联公司'),
              ('2. No offer, no solicitation', '2. 不构成要约及要约邀请'),
              ('How We Work', '我们的工作方式'),
          ]
          missing = []
          for english, chinese in required:
              if english not in text or chinese not in text:
                  missing.append(f'{english} -> {chinese}')
          if missing:
              raise SystemExit('Missing approved mappings:\n' + '\n'.join(missing))

          exact_required = [
              '本投资者门户条款（下称“门户条款”）管辖通过本网站（下称“门户”）访问及使用由新岸资本（ShoreVest Partners, Ltd.） 及其相关关联方',
              '亦不旨在为评估新岸资本、任何 新岸资本管理的载体或任何投资机会提供完整依据。',
              'mediaHero.alt = "新岸资本在 FII Priority 亚洲峰会的专题讨论中发言，面向与会观众";',
          ]
          for item in exact_required:
              if item not in text:
                  raise SystemExit(f'Missing exact approved wording: {item}')

          if '20260730-approved-cn-copy-1' not in guard:
              raise SystemExit('Chinese-copy cache version was not updated')
          if 'important-information' in '\n'.join(
              p.as_posix() for p in Path('.').rglob('*.html')
              if '20260730-approved-cn-copy-1' in p.read_text(encoding='utf-8', errors='ignore')
              and 'important-information' in p.as_posix().lower()
          ):
              raise SystemExit('Important Information HTML was unexpectedly changed')
          PY

      - name: Commit approved Chinese copy rollout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/js/chinese-copy-overrides.js assets/js/favicon-guard.js '*.html'
          if git diff --cached --quiet; then
            echo 'Approved Chinese copy is already current.'
            exit 0
          fi
          git commit -m 'Publish approved Simplified Chinese copy updates'
          git push
