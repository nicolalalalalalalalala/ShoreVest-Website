name: Deploy live Chrome scroll fix
on:
  push:
    paths:
      - '.github/workflows/deploy-live-chrome-scroll-fix.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove scroll locks at source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('assets/css/homepage-rebuild.css')
          s = css.read_text()
          s = s.replace(
              'html,\nbody,\n* {\n  overscroll-behavior: none;\n}',
              'html,\nbody,\n* {\n  overscroll-behavior: auto;\n}'
          )
          s = s.replace(
              '  scrollbar-gutter: stable;\n}',
              '  scrollbar-gutter: stable;\n  min-height: 100%;\n  overflow-x: hidden;\n  overflow-y: auto;\n}'
          )
          s = s.replace(
              '  overflow-x: hidden;\n  overscroll-behavior-y: none;\n}',
              '  overflow: visible;\n  overscroll-behavior-y: auto;\n}'
          )
          css.write_text(s)

          nav = Path('assets/js/sv-navigation.js')
          s = nav.read_text()
          s = re.sub(
              r'\n  // Preserve native vertical scrolling while clipping accidental horizontal\n  // overflow from full-bleed page elements\.\n  if \(document\.body[\s\S]*?\n  // Keep the current desktop navigation item visibly selected after page load\.',
              '\n  // Keep the current desktop navigation item visibly selected after page load.',
              s,
              count=1
          )
          nav.write_text(s)

          index = Path('index.html')
          s = index.read_text()
          old_loader = '<script>document.write(\'<link rel="stylesheet" href="assets/css/homepage-rebuild.css?v=20260717-header-unify">\');</script>'
          new_loader = '<link rel="stylesheet" href="/assets/css/homepage-rebuild.css?v=20260730-live-scroll-14">'
          s = s.replace(old_loader, new_loader)
          guard = '<script src="/assets/js/chrome-scroll-guard.js?v=20260730-live-scroll-14" defer></script>'
          if guard not in s:
              marker = '<script src="assets/js/favicon-guard.js?v=20260730-approved-cn-copy-1" defer></script>'
              s = s.replace(marker, guard + '\n' + marker)
          s = s.replace('favicon-guard.js?v=20260730-approved-cn-copy-1', 'favicon-guard.js?v=20260730-live-scroll-14')
          s = s.replace('visual-review-overrides.css?v=20260730-visual-review-1', 'visual-review-overrides.css?v=20260730-live-scroll-14')
          s = s.replace('sv-navigation.js?v=20260722-public-hotfix', 'sv-navigation.js?v=20260730-live-scroll-14')
          index.write_text(s)
          PY
          rm -f .github/workflows/deploy-live-chrome-scroll-fix.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Fix Chrome scrolling on live ShoreVest site"
          git push