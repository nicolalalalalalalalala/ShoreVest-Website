name: Temporary enable Distressed Debt public applications
on:
  push:
    branches: [agent/enable-distressed-public-applications]
    paths:
      - '.github/workflows/tmp-enable-distressed-public-applications.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enable-distressed-public-applications
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Distressed Debt on the existing secure application form
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'assets/data/recruitment/roles.v1.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const role = manifest.roles.find(r => r.id === 'distressed-debt-investment-manager');
          if (!role) throw new Error('Distressed Debt Investment Manager role missing');
          role.application.enabled = true;
          role.application.privacyNoticeVersion = '2026-08-08-v1';
          role.dateUpdated = '2026-08-09';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-enable-distressed-public-applications.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/recruitment/roles.v1.json .github/workflows/tmp-enable-distressed-public-applications.yml
          git commit -m 'Enable Distressed Debt public online applications'
          git push origin HEAD:agent/enable-distressed-public-applications
