name: One-time repository tidy

on:
  push:
    branches:
      - agent/repository-tidy
    paths:
      - .github/workflows/one-time-repository-tidy.yml

permissions:
  contents: write

jobs:
  tidy-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Organize the homepage hero asset
        shell: bash
        run: |
          set -euo pipefail

          source_path="max-zhang-n49ciNUwej8-unsplash.jpg"
          target_path="assets/img/trees/home-hero-max-zhang.jpg"

          test -f "$source_path"
          mkdir -p "$(dirname "$target_path")"
          git mv "$source_path" "$target_path"

          python3 - <<'PY'
          from pathlib import Path

          old = "max-zhang-n49ciNUwej8-unsplash.jpg"
          new = "assets/img/trees/home-hero-max-zhang.jpg"
          pages = [
              Path("index.html"),
              Path("cn/index.html"),
              Path("home.html"),
              Path("home_cn.html"),
          ]

          replacements = 0
          for page in pages:
              text = page.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"Expected hero reference not found in {page}")
              replacements += count
              page.write_text(text.replace(old, new), encoding="utf-8")

          if replacements != 8:
              raise SystemExit(f"Expected 8 hero references; found {replacements}")
          PY

          rm -f .github/workflows/refresh-contact-favicon-20260724.yml
          rm -f .github/workflows/one-time-repository-tidy.yml

      - name: Validate and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-repository-hygiene.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No cleanup changes required"
            exit 0
          fi

          git commit -m "Organize homepage hero asset"
          git push
