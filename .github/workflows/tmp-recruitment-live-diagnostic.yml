name: Temporary Recruitment Live Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-recruitment-live-diagnostic.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP: svrc26hk-recruit-fn-test
  KEY_VAULT: svrc26hk-recruit-kv-test
  MANAGED_IDENTITY: svrc26hk-recruit-mi-test

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: recruitment-test
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect live state
        shell: bash
        run: |
          set -euo pipefail
          PRINCIPAL_ID="$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name "$MANAGED_IDENTITY" --query principalId -o tsv)"
          CLIENT_ID="$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name "$MANAGED_IDENTITY" --query clientId -o tsv)"
          VAULT_ID="$(az keyvault show --name "$KEY_VAULT" --query id -o tsv)"
          echo '=== CORS ==='
          az functionapp cors show --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json
          echo '=== MANAGED IDENTITY ==='
          echo "clientId=$CLIENT_ID"
          echo "principalId=$PRINCIPAL_ID"
          echo '=== KEY VAULT MODE ==='
          az keyvault show --name "$KEY_VAULT" --query '{rbac:properties.enableRbacAuthorization,publicNetworkAccess:properties.publicNetworkAccess}' -o json
          echo '=== MANAGED IDENTITY ROLES AT VAULT SCOPE ==='
          az role assignment list --assignee-object-id "$PRINCIPAL_ID" --scope "$VAULT_ID" --include-inherited --query '[].{role:roleDefinitionName,scope:scope}' -o json
          echo '=== SECRET SETTING NAMES ==='
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          for setting in RECRUITMENT_COMPLETION_TOKEN_SECRET_NAME RECRUITMENT_FINGERPRINT_SECRET_NAME RECRUITMENT_BOT_VERIFICATION_SECRET_NAME; do
            name="$(jq -r --arg key "$setting" '.[] | select(.name==$key) | .value' <<<"$settings")"
            echo "$setting=$name"
          done
          echo '=== HEALTH ==='
          BASE="https://${FUNCTION_APP}.azurewebsites.net/api/recruitment"
          code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE/health" || true)"
          echo "HTTP $code"
          cat /tmp/health.json
          echo
          echo '=== PREFLIGHT ==='
          curl -sS -X OPTIONS -D /tmp/options.headers -o /tmp/options.body \
            -H 'Origin: https://shorevest.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$BASE/applications/initiate"
          sed -n '1,40p' /tmp/options.headers
          cat /tmp/options.body || true
          echo
          grep -qi '^access-control-allow-origin: https://shorevest.com' /tmp/options.headers
          echo 'Preflight CORS is now valid for shorevest.com.'
