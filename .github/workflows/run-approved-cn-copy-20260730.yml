name: Run approved Chinese copy rollout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-approved-cn-copy-20260730.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/apply-approved-cn-copy-20260730.py
      - run: node --check assets/js/chinese-copy-overrides.js
      - run: node --check assets/js/favicon-guard.js
      - name: Commit approved copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish approved Simplified Chinese copy updates'
          git push
