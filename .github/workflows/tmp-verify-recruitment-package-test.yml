name: Temporary Verify Recruitment Package Test

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/tmp-verify-recruitment-package-test.yml

permissions:
  id-token: write
  contents: write

concurrency:
  group: recruitment-test-package
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP_NAME: svrc26hk-recruit-fn-test

jobs:
  verify:
    name: Verify and clean temporary deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: recruitment-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-recruitment-backend
          fetch-depth: 0

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify disabled package deployment
        shell: bash
        run: |
          set -euo pipefail

          value="$(az functionapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --query "[?name=='RECRUITMENT_API_ENABLED'].value | [0]" \
            --output tsv)"
          if [[ "${value,,}" != 'false' ]]; then
            echo "RECRUITMENT_API_ENABLED=${value}; verification refused." >&2
            exit 1
          fi

          functions=''
          for attempt in $(seq 1 20); do
            functions="$(az functionapp function list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNCTION_APP_NAME" \
              --query '[].name' \
              --output tsv 2>/dev/null || true)"
            count="$(printf '%s\n' "$functions" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [[ "$count" -ge 12 ]]; then
              break
            fi
            echo "Waiting for Functions to index (${count}/12), attempt ${attempt}/20..."
            sleep 30
          done

          count="$(printf '%s\n' "$functions" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$count" -lt 12 ]]; then
            echo "Only ${count} Functions indexed after deployment." >&2
            printf '%s\n' "$functions" >&2
            exit 1
          fi

          for expected in initiateApplication completeUpload finalizeApplication health; do
            if ! printf '%s\n' "$functions" | grep -q "$expected"; then
              echo "Expected Function not indexed: ${expected}" >&2
              exit 1
            fi
          done

          printf 'Verified %s indexed Functions:\n%s\n' "$count" "$functions"

      - name: Remove temporary deployment workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'shorevest-recruitment-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm \
            .github/workflows/tmp-deploy-recruitment-package-test.yml \
            .github/workflows/tmp-verify-recruitment-package-test.yml
          git commit -m 'Remove temporary recruitment package deployment workflows'
          git push origin HEAD:agent/rebuild-recruitment-backend
