name: Temporary Finalize SharePoint Column Names

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-fix-docs-ready-column-names.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Shorten DocsReady SharePoint field prefix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace('DocsReadyNotification', 'DocsRdyNotification')
              updated = updated.replace("'DocsReady'", "'DocsRdy'")
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          Path('.github/workflows/tmp-fix-docs-ready-column-names.yml').unlink()
          PY

      - name: Commit finalized SharePoint field names
        shell: bash
        run: |
          git config user.name "shorevest-recruitment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize SharePoint list internal column names"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
