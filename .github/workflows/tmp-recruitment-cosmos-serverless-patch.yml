name: Temporary Recruitment Cosmos Serverless Patch

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/tmp-recruitment-cosmos-serverless-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-recruitment-backend
          fetch-depth: 0

      - name: Apply exact Cosmos capacity patch
        shell: python
        run: |
          from pathlib import Path

          main_path = Path('infra/recruitment/main.bicep')
          parameters_path = Path('infra/recruitment/test-eastasia.bicepparam')
          main = main_path.read_text(encoding='utf-8')
          parameters = parameters_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          main = replace_once(
              main,
              "@description('Flex Consumption instance memory in MB.')\nparam instanceMemoryMB int = 2048\n",
              "@description('Flex Consumption instance memory in MB.')\nparam instanceMemoryMB int = 2048\n\n@description('Use Cosmos DB serverless capacity. Recommended for dev/test. Capacity mode cannot be changed after account creation.')\nparam enableCosmosServerless bool = false\n\n@minValue(400)\n@description('Shared database throughput when serverless capacity is disabled.')\nparam cosmosSharedThroughput int = 400\n",
              'Cosmos parameters',
          )

          main = replace_once(
              main,
              "    capabilities: []\n",
              "    capabilities: enableCosmosServerless ? [\n      {\n        name: 'EnableServerless'\n      }\n    ] : []\n",
              'Cosmos account capabilities',
          )

          main = replace_once(
              main,
              "    resource: {\n      id: 'recruitment'\n    }\n  }\n}\n\nresource submissions",
              "    resource: {\n      id: 'recruitment'\n    }\n    options: enableCosmosServerless ? {} : {\n      throughput: cosmosSharedThroughput\n    }\n  }\n}\n\nresource submissions",
              'Cosmos database throughput',
          )

          container_markers = [
              "      indexingPolicy: {\n        indexingMode: 'consistent'\n        automatic: true\n      }\n    }\n  }\n}\n\nresource idempotency",
              "        kind: 'Hash'\n      }\n    }\n  }\n}\n\nresource rateLimits",
              "      defaultTtl: 3600\n    }\n  }\n}\n\nresource vault",
          ]
          container_replacements = [
              "      indexingPolicy: {\n        indexingMode: 'consistent'\n        automatic: true\n      }\n    }\n    options: {}\n  }\n}\n\nresource idempotency",
              "        kind: 'Hash'\n      }\n    }\n    options: {}\n  }\n}\n\nresource rateLimits",
              "      defaultTtl: 3600\n    }\n    options: {}\n  }\n}\n\nresource vault",
          ]
          for index, (old, new) in enumerate(zip(container_markers, container_replacements), start=1):
              main = replace_once(main, old, new, f'Cosmos container options {index}')

          parameters = replace_once(
              parameters,
              "param enableDefenderForStorage = false\n",
              "param enableDefenderForStorage = false\nparam enableCosmosServerless = true\n",
              'Test serverless parameter',
          )

          main_path.write_text(main, encoding='utf-8')
          parameters_path.write_text(parameters, encoding='utf-8')

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q "param enableCosmosServerless bool = false" infra/recruitment/main.bicep
          grep -q "name: 'EnableServerless'" infra/recruitment/main.bicep
          grep -q "param enableCosmosServerless = true" infra/recruitment/test-eastasia.bicepparam
          [[ "$(grep -c 'options: {}' infra/recruitment/main.bicep)" -eq 3 ]]
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'shorevest-recruitment-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add infra/recruitment/main.bicep infra/recruitment/test-eastasia.bicepparam
          git commit -m 'Fix Cosmos capacity for recruitment foundation'
          git push origin HEAD:agent/rebuild-recruitment-backend
