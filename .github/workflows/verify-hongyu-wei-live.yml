name: Verify Hongyu Wei live (one-time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live shorevest.com pages and check the corrected name
        shell: python
        run: |
          import time, urllib.request, sys

          OLD = '魏洪宇'  # 魏洪宇 (incorrect)
          NEW = '魏宏宇'  # 魏宏宇 (correct)

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
                  'User-Agent': 'Mozilla/5.0 (ShoreVest live verify)',
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read().decode('utf-8', 'replace')

          targets = [
              'https://shorevest.com/cn/team/',
              'https://shorevest.com/team_cn.html',
          ]

          def check_once(bust):
              results = {}
              for base in targets:
                  url = base + (('?_v=' + bust) if bust else '')
                  try:
                      status, body = fetch(url)
                  except Exception as e:
                      results[url] = {'ok': False, 'err': repr(e)}
                      continue
                  results[url] = {
                      'ok': (NEW in body) and (OLD not in body),
                      'http': status,
                      'new_present': NEW in body,
                      'old_present': OLD in body,
                  }
              return results

          deadline = time.time() + 300  # up to 5 minutes for Pages/CDN to flip
          final = None
          while time.time() < deadline:
              bust = str(int(time.time()))
              # cache-busted first (origin), then plain public URL (through CDN)
              r_bust = check_once(bust)
              r_plain = check_once('')
              final = {'cache_busted': r_bust, 'plain_public_url': r_plain}
              all_ok = all(v.get('ok') for v in r_bust.values()) and \
                       all(v.get('ok') for v in r_plain.values())
              if all_ok:
                  break
              time.sleep(10)

          lines = []
          def emit(s):
              print(s); lines.append(s)

          emit('## Hongyu Wei live verification')
          emit('')
          overall_ok = True
          for group, res in final.items():
              emit('### ' + group)
              for url, v in res.items():
                  if not v.get('ok'):
                      overall_ok = False
                  emit('- `%s` -> ok=%s | http=%s | new(魏宏宇)=%s | old(魏洪宇)=%s%s' % (
                      url, v.get('ok'), v.get('http'),
                      v.get('new_present'), v.get('old_present'),
                      (' | err=%s' % v['err']) if v.get('err') else '',
                  ))
              emit('')

          summary_path = __import__('os').environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(lines) + '\n')

          if overall_ok:
              emit('RESULT: PASS - shorevest.com serves 魏宏宇 and no longer 魏洪宇')
              sys.exit(0)
          else:
              emit('RESULT: FAIL - live site not yet fully corrected')
              sys.exit(1)
