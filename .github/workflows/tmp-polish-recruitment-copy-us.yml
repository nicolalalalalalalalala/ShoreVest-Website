name: Temporary Polish Recruitment Copy US

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-polish-recruitment-copy-us.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polish-recruitment-copy-us
          fetch-depth: 0

      - name: Polish English recruitment copy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          pages = [
              Path('careers/apply.html'),
              Path('careers/apply/index.html'),
              Path('careers/application-test-20260808.html'),
          ]

          replacements = {
              'Apply for this role': 'Apply to ShoreVest',
              'Complete the form below. Your application is stored securely by ShoreVest. Email delivery is not used for this intake.': 'Please complete the form below to apply. We use the information you provide to evaluate your candidacy and administer the recruitment process.',
              'Candidate details': 'Contact information',
              'Current city or location': 'Current location',
              'Telephone number': 'Phone number',
              'LinkedIn profile URL': 'LinkedIn profile',
              'Short note': 'Additional note',
              'You may briefly explain your interest in the role or relevant experience.': 'Share any context you would like us to consider with your application.',
              '>CV <span class="careers-application__req">*</span>': '>Resume or CV <span class="careers-application__req">*</span>',
              'PDF or DOCX only. Maximum 10 MB.': 'PDF or DOCX, up to 10 MB.',
              'Confirmations': 'Acknowledgments',
              "I acknowledge ShoreVest's <a href=\"../privacy-policy/\" target=\"_blank\" rel=\"noopener\">Privacy Policy</a> and the use of the information submitted to assess my candidacy and administer the recruitment process.": "I have read ShoreVest's <a href=\"../privacy-policy/\" target=\"_blank\" rel=\"noopener\">Privacy Policy</a> and understand that the information I submit will be used to evaluate my candidacy and administer the recruitment process.",
              'I confirm that the information submitted is accurate to the best of my knowledge.': 'I confirm that the information I have provided is accurate and complete to the best of my knowledge.',
              'Security check': 'Security verification',
              'Please do not include identity-document numbers, bank information, medical information or other unnecessary sensitive personal information. ShoreVest never asks candidates to make a payment.': 'Please do not include government ID numbers, bank account information, medical information, or other sensitive personal information that is not relevant to your application. ShoreVest will never ask candidates to pay a fee as part of the recruitment process.',
          }

          for p in pages:
              s = p.read_text()
              for old, new in replacements.items():
                  if old not in s:
                      raise SystemExit(f'Missing expected copy in {p}: {old}')
                  s = s.replace(old, new)
              p.write_text(s)

          js = Path('assets/js/recruitment-application.js')
          s = js.read_text()
          js_replacements = {
              "unavailable: 'Applications are not available at this time.'": "unavailable: 'Online applications are currently unavailable.'",
              "closed: 'Applications are not currently being accepted for this position.'": "closed: 'This position is not currently accepting applications.'",
              "fileMissing: 'Please attach your CV.'": "fileMissing: 'Please upload your resume or CV.'",
              "accuracy: 'Please confirm that the information is accurate.'": "accuracy: 'Please confirm that the information you provided is accurate.'",
              "bot: 'Please complete the security check.'": "bot: 'Please complete the security verification.'",
              "generic: 'Your application could not be submitted. Please try again.'": "generic: 'We could not submit your application. Please try again.'",
              "network: 'Your application could not be submitted. Please check your connection and try again.'": "network: 'We could not submit your application. Please check your connection and try again.'",
              "rate: 'Too many attempts were received. Please wait and try again.'": "rate: 'Too many attempts were received. Please wait a few minutes and try again.'",
              "successBody: 'Your application has been securely received by ShoreVest.'": "successBody: 'Thank you for applying to ShoreVest. We have received your application.'",
          }
          for old, new in js_replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected JS copy: {old}')
              s = s.replace(old, new)
          js.write_text(s)

          for path in [Path('assets/data/recruitment/roles.v1.json'), Path('services/recruitment-functions/src/roles.v1.json')]:
              s = path.read_text()
              s = s.replace('drive projects towards compliant closing and execution', 'drive projects toward compliant closing and execution')
              s = s.replace('A Fund Practising Qualification Certificate is preferred but not required.', 'A Fund Practitioner Qualification Certificate is preferred but not required.')
              path.write_text(s)
          PY

      - name: Validate recruitment copy changes
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run validate:recruitment
          npm run check:recruitment
          npm run test:recruitment
          npm run check:security
          grep -q 'Apply to ShoreVest' careers/application-test-20260808.html
          grep -q 'Phone number' careers/apply.html
          grep -q 'Resume or CV' careers/apply.html
          grep -q 'Security verification' careers/apply.html
          ! grep -RniE 'practising|towards' assets/data/recruitment/roles.v1.json services/recruitment-functions/src/roles.v1.json
          git diff --check

      - name: Commit copy polish and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-polish-recruitment-copy-us.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add careers/apply.html careers/apply/index.html careers/application-test-20260808.html assets/js/recruitment-application.js assets/data/recruitment/roles.v1.json services/recruitment-functions/src/roles.v1.json .github/workflows/tmp-polish-recruitment-copy-us.yml
          git diff --cached --check
          git commit -m "Polish Careers application copy in American English"
          git push origin HEAD:agent/polish-recruitment-copy-us
