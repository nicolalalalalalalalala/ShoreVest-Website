name: Fix overscroll final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-overscroll-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Remove runtime overscroll override
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/js/sv-navigation.js')
          text = path.read_text(encoding='utf-8')
          old = "body.homepage * { overscroll-behavior: auto !important; }"
          new = "body.homepage * { overscroll-behavior: none !important; }"
          if old not in text:
              raise SystemExit('Expected overscroll override not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-overscroll-final.yml

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/sv-navigation.js .github/workflows/fix-overscroll-final.yml
          git commit -m "Remove runtime overscroll override"
          git push origin main
