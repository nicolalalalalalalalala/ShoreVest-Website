name: Temporary Recruitment Diagnostic Deploy

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/tmp-recruitment-diagnostic-deploy.yml

permissions:
  id-token: write
  contents: write

concurrency:
  group: recruitment-diagnostic-deploy
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP: svrc26hk-recruit-fn-test

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: recruitment-test
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/recruitment-functions/package-lock.json

      - id: login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - id: safety
        name: Verify non-delivery controls remain off
        shell: bash
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          value() { jq -r --arg key "$1" '.[] | select(.name == $key) | .value' <<<"$settings" | tr '[:upper:]' '[:lower:]'; }
          for key in RECRUITMENT_OUTBOX_DELIVERY_ENABLED RECRUITMENT_CANDIDATE_ACK_ENABLED RECRUITMENT_HR_ACCESS_ENABLED RECRUITMENT_RETENTION_ENABLED RECRUITMENT_RETENTION_DELETION_ENABLED; do
            [[ "$(value "$key")" == 'false' ]] || { echo "$key must remain false." >&2; exit 1; }
          done

      - id: manifest
        name: Verify controlled role
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const m = require('./assets/data/recruitment/roles.v1.json');
          const enabled = m.roles.filter(r => r.application?.enabled === true);
          if (enabled.length !== 1 || enabled[0].id !== 'legal-assistant' || enabled[0].application.privacyNoticeVersion !== '2026-08-08-v1') throw new Error('Unexpected role gate');
          NODE

      - id: package
        name: Build package
        shell: pwsh
        run: |
          ./services/recruitment-functions/scripts/package.ps1 -CommitSha '${{ github.sha }}' -OutputPath "$env:RUNNER_TEMP/recruitment-functions.zip"

      - id: deploy
        name: Deploy package
        shell: bash
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --src "$RUNNER_TEMP/recruitment-functions.zip" --build-remote false --timeout 600 --output none

      - id: index
        name: Verify Functions indexed
        shell: bash
        run: |
          set -euo pipefail
          expected=(initiateApplication completeUpload finalizeApplication health)
          for attempt in $(seq 1 24); do
            names="$(az functionapp function list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --query '[].name' -o tsv 2>/dev/null | sed 's#^.*/##' || true)"
            missing=0
            for name in "${expected[@]}"; do grep -qx "$name" <<<"$names" || missing=$((missing+1)); done
            [[ "$missing" == 0 ]] && exit 0
            sleep 15
          done
          exit 1

      - id: probe
        name: Enable capture-only and capture diagnostic health
        shell: bash
        run: |
          set -euo pipefail
          az functionapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --settings RECRUITMENT_CAPTURE_ONLY_MODE=true RECRUITMENT_API_ENABLED=true RECRUITMENT_OUTBOX_DELIVERY_ENABLED=false RECRUITMENT_CANDIDATE_ACK_ENABLED=false RECRUITMENT_HR_ACCESS_ENABLED=false RECRUITMENT_RETENTION_ENABLED=false RECRUITMENT_RETENTION_DELETION_ENABLED=false --output none
          az functionapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --output none

          healthy=false
          code=000
          echo '{}' > /tmp/health.json
          for attempt in $(seq 1 24); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "https://${FUNCTION_APP}.azurewebsites.net/api/recruitment/health" || true)"
            echo "Health attempt $attempt: HTTP $code"
            cat /tmp/health.json || true
            echo
            if [[ "$code" == '200' ]] && jq -e '.ok == true and .dependencies == "ready"' /tmp/health.json >/dev/null 2>&1; then healthy=true; break; fi
            sleep 10
          done
          cp /tmp/health.json recruitment-diagnostic-health.json
          printf '%s' "$code" > /tmp/http-code
          printf '%s' "$healthy" > /tmp/healthy

          if [[ "$healthy" != 'true' ]]; then
            az functionapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --settings RECRUITMENT_API_ENABLED=false RECRUITMENT_CAPTURE_ONLY_MODE=false --output none
            az functionapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --output none
          fi

      - name: Record diagnostic result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          SAFETY_OUTCOME: ${{ steps.safety.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          INDEX_OUTCOME: ${{ steps.index.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          code="$(cat /tmp/http-code 2>/dev/null || true)"
          healthy="$(cat /tmp/healthy 2>/dev/null || true)"
          cat > recruitment-diagnostic-status.json <<EOF
          {
            "jobStatus": "${JOB_STATUS}",
            "healthHttp": "${code}",
            "healthy": "${healthy}",
            "sourceCommit": "${GITHUB_SHA}",
            "recordedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "steps": {
              "login": "${LOGIN_OUTCOME}",
              "safety": "${SAFETY_OUTCOME}",
              "manifest": "${MANIFEST_OUTCOME}",
              "package": "${PACKAGE_OUTCOME}",
              "deploy": "${DEPLOY_OUTCOME}",
              "index": "${INDEX_OUTCOME}",
              "probe": "${PROBE_OUTCOME}"
            }
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recruitment-diagnostic-status.json
          [[ -f recruitment-diagnostic-health.json ]] && git add recruitment-diagnostic-health.json
          git commit -m 'Record recruitment dependency diagnostic [skip ci]' || exit 0
          git push origin HEAD:agent/rebuild-recruitment-backend
