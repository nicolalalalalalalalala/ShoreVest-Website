name: Install Google Analytics

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/install-google-analytics.cjs'
      - '.github/workflows/install-google-analytics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install tag across public pages
        run: node scripts/install-google-analytics.cjs

      - name: Validate installation
        run: node scripts/install-google-analytics.cjs --validate

      - name: Check generated changes
        run: git diff --check

      - name: Commit sitewide tag installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Google Analytics is already installed."
            exit 0
          fi
          git commit -m "Install Google Analytics across public pages"
          git push origin HEAD:main
