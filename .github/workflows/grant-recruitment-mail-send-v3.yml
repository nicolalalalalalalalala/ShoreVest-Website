name: Repair recruitment Mail.Send with exact identity

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/grant-recruitment-mail-send-v3.yml

permissions:
  id-token: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: recruitment-test
    env:
      AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
      AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
      AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
      AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
      MANAGED_IDENTITY: svrc26hk-recruit-mi-test
      FUNCTION_APP: svrc26hk-recruit-fn-test
      GRAPH_APP_ID: 00000003-0000-0000-c000-000000000000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-recruitment-backend
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Grant Microsoft Graph Mail.Send application permission
        shell: bash
        run: |
          set -u
          status=unknown
          detail=''
          principal="$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name "$MANAGED_IDENTITY" --query principalId -o tsv 2>/tmp/identity.err || true)"
          client="$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name "$MANAGED_IDENTITY" --query clientId -o tsv 2>>/tmp/identity.err || true)"
          if [[ -z "$principal" ]]; then
            status=failed
            detail="Could not resolve user-assigned managed identity ${MANAGED_IDENTITY}: $(tr '\n' ' ' </tmp/identity.err | head -c 800)"
          else
            graph_json="$(az ad sp show --id "$GRAPH_APP_ID" -o json 2>/tmp/graph.err || true)"
            graph_sp="$(jq -r '.id // empty' <<<"$graph_json" 2>/dev/null || true)"
            role="$(jq -r '[.appRoles[]? | select(.value == "Mail.Send" and (.allowedMemberTypes | index("Application")))] | .[0].id // empty' <<<"$graph_json" 2>/dev/null || true)"
            if [[ -z "$graph_sp" || -z "$role" ]]; then
              status=failed
              detail="Identity resolved (${principal}), but Graph service-principal metadata was unavailable: $(tr '\n' ' ' </tmp/graph.err | head -c 800)"
            else
              assignments="$(az rest --method GET --uri "https://graph.microsoft.com/v1.0/servicePrincipals/${principal}/appRoleAssignments" 2>/tmp/list.err || true)"
              count="$(jq -r --arg r "$graph_sp" --arg a "$role" '[.value[]? | select(.resourceId == $r and .appRoleId == $a)] | length' <<<"$assignments" 2>/dev/null || echo 0)"
              if [[ "$count" =~ ^[1-9] ]]; then
                status=already_present
                detail="Microsoft Graph Mail.Send is already assigned in Entra to managed identity ${MANAGED_IDENTITY} (${principal}; client ${client})."
              else
                body="$(jq -cn --arg p "$principal" --arg r "$graph_sp" --arg a "$role" '{principalId:$p,resourceId:$r,appRoleId:$a}')"
                if az rest --method POST --uri "https://graph.microsoft.com/v1.0/servicePrincipals/${principal}/appRoleAssignments" --headers Content-Type=application/json --body "$body" >/tmp/grant.out 2>/tmp/grant.err; then
                  status=granted
                  detail="Microsoft Graph Mail.Send assigned in Entra to managed identity ${MANAGED_IDENTITY} (${principal}; client ${client}). Exchange mailbox scoping must still authorize Application Mail.Send for careers@shorevest.com."
                  az functionapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --output none || true
                else
                  status=failed
                  detail="Identity ${principal} resolved, but Entra rejected Mail.Send assignment: $(tr '\n' ' ' </tmp/grant.err | head -c 1000)"
                fi
              fi
            fi
          fi
          jq -n --arg status "$status" --arg detail "$detail" --arg principal "$principal" --arg client "$client" --arg recordedAtUtc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{status:$status,detail:$detail,principalId:$principal,clientId:$client,recordedAtUtc:$recordedAtUtc}' > recruitment-mail-send-permission-status.json

      - name: Save result and remove workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/grant-recruitment-mail-send-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record exact recruitment Mail.Send repair attempt' || exit 0
          git push origin HEAD:agent/rebuild-recruitment-backend
