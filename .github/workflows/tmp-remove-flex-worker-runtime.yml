name: Temporary Remove Flex Worker Runtime Setting

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/tmp-remove-flex-worker-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-recruitment-backend
          fetch-depth: 0

      - name: Remove invalid Flex Consumption app setting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('infra/recruitment/main.bicep')
          text = path.read_text()
          old = """        {
            name: 'FUNCTIONS_WORKER_RUNTIME'
            value: 'node'
          }
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one FUNCTIONS_WORKER_RUNTIME block, found {text.count(old)}')
          path.write_text(text.replace(old, ''))
          PY

          git diff --check
          git diff --exit-code -- infra/recruitment/main.bicep && {
            echo 'Patch produced no change.' >&2
            exit 1
          }

          git config user.name 'shorevest-recruitment-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add infra/recruitment/main.bicep
          git commit -m 'Remove invalid Flex Consumption worker runtime setting'
          git push origin HEAD:agent/rebuild-recruitment-backend
