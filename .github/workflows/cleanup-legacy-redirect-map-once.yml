name: Clean production legacy redirect map once

on:
  push:
    branches:
      - fix/production-redirect-audit-cleanup-20260820
    paths:
      - '.github/workflows/cleanup-legacy-redirect-map-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-redirect-audit-cleanup-20260820

      - name: Remove stale and self mappings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/js/legacy-404-redirects.js')
          text = p.read_text(encoding='utf-8')
          remove = [
              "    '/insights/china-debt-dynamics/v9i3/': '/insights/china-debt-dynamics/v9i3/',\n",
              "    '/careers/legal-assistant': '/careers/',\n",
          ]
          for line in remove:
              if line not in text:
                  raise SystemExit(f'Expected mapping not found: {line.strip()}')
              text = text.replace(line, '', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/cleanup-legacy-redirect-map-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove stale legacy redirect mappings"
          git push origin HEAD:fix/production-redirect-audit-cleanup-20260820
