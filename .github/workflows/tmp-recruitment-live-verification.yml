name: Temporary Recruitment Live Verification

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/tmp-recruitment-live-verification.yml

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP: svrc26hk-recruit-fn-test

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: recruitment-test
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Verify live state
        shell: bash
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          jq '[.[] | select(.name=="RECRUITMENT_API_ENABLED" or .name=="RECRUITMENT_CAPTURE_ONLY_MODE" or .name=="RECRUITMENT_OUTBOX_DELIVERY_ENABLED" or .name=="RECRUITMENT_CANDIDATE_ACK_ENABLED" or .name=="RECRUITMENT_HR_ACCESS_ENABLED" or .name=="RECRUITMENT_RETENTION_ENABLED" or .name=="RECRUITMENT_RETENTION_DELETION_ENABLED" or .name=="RECRUITMENT_BOT_VERIFICATION_MODE") | {name,value}]' <<<"$settings" > recruitment-live-flags.json

          health_code="$(curl -sS -o recruitment-live-health.json -w '%{http_code}' "https://${FUNCTION_APP}.azurewebsites.net/api/recruitment/health" || true)"
          preflight_code="$(curl -sS -o /tmp/preflight-body -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://shorevest.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "https://${FUNCTION_APP}.azurewebsites.net/api/recruitment/applications/initiate" || true)"

          api_enabled="$(jq -r '.[] | select(.name=="RECRUITMENT_API_ENABLED") | .value' recruitment-live-flags.json | tr '[:upper:]' '[:lower:]')"
          capture_only="$(jq -r '.[] | select(.name=="RECRUITMENT_CAPTURE_ONLY_MODE") | .value' recruitment-live-flags.json | tr '[:upper:]' '[:lower:]')"
          unsafe_count="$(jq '[.[] | select((.name=="RECRUITMENT_OUTBOX_DELIVERY_ENABLED" or .name=="RECRUITMENT_CANDIDATE_ACK_ENABLED" or .name=="RECRUITMENT_HR_ACCESS_ENABLED" or .name=="RECRUITMENT_RETENTION_ENABLED" or .name=="RECRUITMENT_RETENTION_DELETION_ENABLED") and (.value|ascii_downcase)!="false")] | length' recruitment-live-flags.json)"

          cat > recruitment-live-verification.json <<EOF
          {
            "apiEnabled": "${api_enabled}",
            "captureOnly": "${capture_only}",
            "unsafeEnabledCount": ${unsafe_count},
            "healthHttp": "${health_code}",
            "preflightHttp": "${preflight_code}",
            "verifiedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          [[ "$api_enabled" == 'true' ]]
          [[ "$capture_only" == 'true' ]]
          [[ "$unsafe_count" == '0' ]]
          [[ "$health_code" == '200' ]]
          [[ "$preflight_code" == '204' || "$preflight_code" == '200' ]]
      - name: Record verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recruitment-live-verification.json recruitment-live-flags.json recruitment-live-health.json 2>/dev/null || true
          git commit -m 'Record live recruitment verification [skip ci]' || exit 0
          git push origin HEAD:agent/rebuild-recruitment-backend
