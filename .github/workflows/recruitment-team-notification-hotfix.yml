name: Recruitment team notification hotfix

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/recruitment-team-notification-hotfix.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: recruitment-team-notification-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: recruitment-test
    env:
      AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
      AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
      AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
      AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
      FUNCTION_APP: svrc26hk-recruit-fn-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-recruitment-backend
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch team notification routing
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'services/recruitment-functions/src/lib/config.js',
              """    teamNotification: {\n      enabled: bool(env.RECRUITMENT_TEAM_NOTIFICATION_ENABLED),\n      mailbox: String(env.RECRUITMENT_TEAM_NOTIFICATION_MAILBOX || candidateMailbox).trim()\n    },""",
              """    teamNotification: {\n      enabled: bool(env.RECRUITMENT_TEAM_NOTIFICATION_ENABLED),\n      mailbox: String(env.RECRUITMENT_TEAM_NOTIFICATION_MAILBOX || candidateMailbox).trim(),\n      recipients: commaList(\n        env.RECRUITMENT_TEAM_NOTIFICATION_RECIPIENTS ||\n        env.RECRUITMENT_TEAM_NOTIFICATION_MAILBOX ||\n        candidateMailbox\n      )\n    },"""
          )

          replace(
              'services/recruitment-functions/src/lib/config.js',
              """    if (!config.teamNotification?.mailbox) missing.push('teamNotification.mailbox');\n    else if (!validShoreVestMailbox(config.teamNotification.mailbox)) {\n      invalid.push('teamNotification.mailbox');\n    } else if (\n      config.candidateAcknowledgement?.mailbox &&\n      config.teamNotification.mailbox.toLowerCase() !== config.candidateAcknowledgement.mailbox.toLowerCase()\n    ) {\n      // The same mailbox is intentionally used for candidate send-as and internal\n      // recruitment notifications. Readiness probes this mailbox once, which\n      // guarantees both delivery paths use a verified Graph/Exchange target.\n      invalid.push('teamNotification.mailbox');\n    }""",
              """    if (!config.teamNotification?.mailbox) missing.push('teamNotification.mailbox');\n    else if (!validShoreVestMailbox(config.teamNotification.mailbox)) {\n      invalid.push('teamNotification.mailbox');\n    }\n    if (!Array.isArray(config.teamNotification?.recipients) || config.teamNotification.recipients.length === 0) {\n      missing.push('teamNotification.recipients');\n    } else if (config.teamNotification.recipients.some((recipient) => !validShoreVestMailbox(recipient))) {\n      invalid.push('teamNotification.recipients');\n    }"""
          )

          replace(
              'services/recruitment-functions/src/outbox/dispatcher.js',
              """    toRecipients: [{ emailAddress: { address: config.mailbox } }]""",
              """    toRecipients: config.recipients.map((address) => ({ emailAddress: { address } }))"""
          )

          replace(
              'services/recruitment-functions/test/teamNotification.test.js',
              """  const message = teamNotificationMessage(application(), { mailbox: 'careers@shorevest.com' });\n  assert.equal(message.toRecipients[0].emailAddress.address, 'careers@shorevest.com');""",
              """  const message = teamNotificationMessage(application(), {\n    mailbox: 'careers@shorevest.com',\n    recipients: ['careers@shorevest.com', 'hr@shorevest.com']\n  });\n  assert.deepEqual(\n    message.toRecipients.map((recipient) => recipient.emailAddress.address),\n    ['careers@shorevest.com', 'hr@shorevest.com']\n  );"""
          )

          replace(
              'services/recruitment-functions/test/configAcknowledgement.test.js',
              """    RECRUITMENT_TEAM_NOTIFICATION_ENABLED: 'true',\n    RECRUITMENT_TEAM_NOTIFICATION_MAILBOX: 'careers@shorevest.com',""",
              """    RECRUITMENT_TEAM_NOTIFICATION_ENABLED: 'true',\n    RECRUITMENT_TEAM_NOTIFICATION_MAILBOX: 'careers@shorevest.com',\n    RECRUITMENT_TEAM_NOTIFICATION_RECIPIENTS: 'careers@shorevest.com,hr@shorevest.com',"""
          )

          p = Path('.github/workflows/recruitment-functions.yml')
          text = p.read_text()
          needle = "              RECRUITMENT_TEAM_NOTIFICATION_MAILBOX=careers@shorevest.com \\\n"
          replacement = needle + "              RECRUITMENT_TEAM_NOTIFICATION_RECIPIENTS=careers@shorevest.com,hr@shorevest.com \\\n"
          if 'RECRUITMENT_TEAM_NOTIFICATION_RECIPIENTS=' not in text:
              if needle not in text:
                  raise SystemExit('Notification mailbox activation setting not found')
              p.write_text(text.replace(needle, replacement, 1))

      - name: Validate recruitment notification tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/teamNotification.test.js test/configAcknowledgement.test.js
        working-directory: services/recruitment-functions

      - name: Commit durable source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ShoreVest Recruitment Hotfix'
          git config user.email 'careers@shorevest.com'
          git add services/recruitment-functions/src/lib/config.js \
                  services/recruitment-functions/src/outbox/dispatcher.js \
                  services/recruitment-functions/test/teamNotification.test.js \
                  services/recruitment-functions/test/configAcknowledgement.test.js \
                  .github/workflows/recruitment-functions.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Route recruitment notifications to team inboxes'
            git push origin HEAD:agent/rebuild-recruitment-backend
          fi

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Package and deploy patched recruitment backend
        shell: bash
        run: |
          set -euo pipefail
          pwsh ./services/recruitment-functions/scripts/package.ps1 \
            -CommitSha "$(git rev-parse HEAD)" \
            -OutputPath "$RUNNER_TEMP/recruitment-functions.zip"
          az functionapp deployment source config-zip \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --src "$RUNNER_TEMP/recruitment-functions.zip" \
            --build-remote false \
            --timeout 600 \
            --output none
          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --settings \
              RECRUITMENT_TEAM_NOTIFICATION_ENABLED=true \
              RECRUITMENT_TEAM_NOTIFICATION_MAILBOX=careers@shorevest.com \
              RECRUITMENT_TEAM_NOTIFICATION_RECIPIENTS=careers@shorevest.com,hr@shorevest.com \
            --output none
          az functionapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP"

      - name: Check Entra protection state for HR CV access
        shell: bash
        run: |
          set -euo pipefail
          resource_id="$(az functionapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --query id -o tsv)"
          auth_json="$(az rest --method post --url "https://management.azure.com${resource_id}/config/authsettingsV2/list?api-version=2024-04-01" 2>/dev/null || echo '{}')"
          require_auth="$(jq -r '.properties.globalValidation.requireAuthentication // false' <<<"$auth_json")"
          unauth_action="$(jq -r '.properties.globalValidation.unauthenticatedClientAction // "unknown"' <<<"$auth_json")"
          aad_enabled="$(jq -r '.properties.identityProviders.azureActiveDirectory.enabled // false' <<<"$auth_json")"
          echo "HR_AUTH_REQUIRE_AUTHENTICATION=$require_auth"
          echo "HR_AUTH_UNAUTHENTICATED_ACTION=$unauth_action"
          echo "HR_AUTH_AAD_ENABLED=$aad_enabled"

      - name: Verify recruitment backend health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "https://${FUNCTION_APP}.azurewebsites.net/api/recruitment/health" || true)"
            if [[ "$code" == '200' ]] && jq -e '.ok == true and .configuration == "valid" and .dependencies == "ready"' "$RUNNER_TEMP/health.json" >/dev/null 2>&1; then
              cat "$RUNNER_TEMP/health.json"
              exit 0
            fi
            sleep 10
          done
          cat "$RUNNER_TEMP/health.json" >&2 || true
          exit 1

# second push intentionally retriggers this workflow after it exists on the branch
