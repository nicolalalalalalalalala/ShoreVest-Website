        run: |
          npm run check:recruitment
          npm run validate:recruitment
          npm run test:recruitment
          git diff --check
      - name: Commit refinements
        run: |
          rm .github/workflows/tmp-refine-careers-application.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add careers/apply.html careers/apply_cn.html assets/js/recruitment-application.js assets/css/recruitment-application.css assets/data/recruitment/roles.v1.json assets/js/recruitment-role-detail.js careers/distressed-debt-investment-manager.html careers/distressed-debt-investment-manager_cn.html careers/legal-assistant.html careers/legal-assistant_cn.html tests/recruitment-role-detail.test.js .github/workflows/tmp-refine-careers-application.yml
          git commit -m 'Refine Careers application and Distressed Debt role'
          git push origin HEAD:agent/refine-careers-application-and-distressed-role