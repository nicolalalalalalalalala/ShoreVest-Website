name: Temporary Remove Flex Runtime from Settings

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/tmp-remove-flex-runtime-from-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-recruitment-backend
          fetch-depth: 0

      - name: Remove invalid Flex runtime app setting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('infra/recruitment/runtime-settings.v2.bicep')
          text = path.read_text()
          old = "    FUNCTIONS_WORKER_RUNTIME: 'node'\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one runtime setting, found {text.count(old)}')
          path.write_text(text.replace(old, ''))
          PY

          git diff --check
          git diff --exit-code -- infra/recruitment/runtime-settings.v2.bicep && {
            echo 'Patch produced no change.' >&2
            exit 1
          }

          git config user.name 'shorevest-recruitment-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add infra/recruitment/runtime-settings.v2.bicep
          git commit -m 'Remove invalid Flex runtime app setting from runtime settings'
          git push origin HEAD:agent/rebuild-recruitment-backend
