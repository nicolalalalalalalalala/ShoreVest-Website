name: Temporary Turnstile Runtime Config Check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-check-turnstile-runtime-config.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP: svrc26hk-recruit-fn-test
  KEY_VAULT: svrc26hk-recruit-kv-test

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: recruitment-test
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect non-secret Turnstile runtime settings
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FUNCTION SETTINGS ==='
          az functionapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --query "[?name=='RECRUITMENT_BOT_VERIFICATION_MODE' || name=='RECRUITMENT_BOT_VERIFICATION_SECRET_NAME' || name=='RECRUITMENT_BOT_VERIFICATION_HOSTNAME' || name=='RECRUITMENT_BOT_VERIFICATION_ACTION' || name=='RECRUITMENT_BOT_VERIFICATION_ENDPOINT' || name=='RECRUITMENT_ALLOWED_ORIGINS'].{name:name,value:value}" \
            -o table
          echo '=== TURNSTILE SECRET METADATA ONLY ==='
          az keyvault secret show \
            --vault-name "$KEY_VAULT" \
            --name recruitment-turnstile-secret \
            --query '{name:name,enabled:attributes.enabled,updated:attributes.updated}' \
            -o json || true
