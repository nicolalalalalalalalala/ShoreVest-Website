name: Temporary Recruitment Key Vault Repair

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/tmp-recruitment-keyvault-repair.yml

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP: svrc26hk-recruit-fn-test
  KEY_VAULT: svrc26hk-recruit-kv-test
  FUNCTION_MI_PRINCIPAL_ID: add37994-bada-4dae-97f1-6ac7f11f4ca9

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: recruitment-test
    steps:
      - uses: actions/checkout@v4
      - id: login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - id: diagnose
        name: Diagnose and attempt least-privilege repair
        shell: bash
        run: |
          set -euo pipefail
          vault_id="$(az keyvault show --resource-group "$AZURE_RESOURCE_GROUP" --name "$KEY_VAULT" --query id -o tsv)"

          role_count="$(az role assignment list \
            --assignee-object-id "$FUNCTION_MI_PRINCIPAL_ID" \
            --scope "$vault_id" \
            --role 'Key Vault Secrets User' \
            --fill-principal-name false \
            --query 'length(@)' -o tsv)"

          secret_exists() {
            local name="$1"
            if az resource show --ids "${vault_id}/secrets/${name}" --api-version 2023-07-01 --query name -o tsv >/dev/null 2>&1; then
              printf 'true'
            else
              printf 'false'
            fi
          }

          completion_exists="$(secret_exists recruitment-completion-token-key)"
          fingerprint_exists="$(secret_exists recruitment-fingerprint-key)"
          turnstile_exists="$(secret_exists recruitment-turnstile-secret)"

          role_create='not-needed'
          if [[ "$role_count" == '0' ]]; then
            set +e
            az role assignment create \
              --assignee-object-id "$FUNCTION_MI_PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --role 'Key Vault Secrets User' \
              --scope "$vault_id" \
              --output none 2>/tmp/role-error.txt
            rc=$?
            set -e
            if [[ "$rc" == '0' ]]; then
              role_create='success'
              role_count='1'
            else
              role_create='permission-denied'
            fi
          fi

          cat > recruitment-keyvault-diagnostic.json <<EOF
          {
            "roleAssignmentCount": ${role_count},
            "roleCreate": "${role_create}",
            "completionSecretExists": ${completion_exists},
            "fingerprintSecretExists": ${fingerprint_exists},
            "turnstileSecretExists": ${turnstile_exists},
            "checkedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          if [[ "$role_count" != '0' && "$completion_exists" == 'true' && "$fingerprint_exists" == 'true' && "$turnstile_exists" == 'true' ]]; then
            az functionapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --output none
            healthy=false
            for attempt in $(seq 1 30); do
              code="$(curl -sS -o recruitment-keyvault-repair-health.json -w '%{http_code}' "https://${FUNCTION_APP}.azurewebsites.net/api/recruitment/health" || true)"
              if [[ "$code" == '200' ]] && jq -e '.ok == true and .dependencies == "ready"' recruitment-keyvault-repair-health.json >/dev/null 2>&1; then
                healthy=true
                break
              fi
              sleep 10
            done
            printf '%s' "$healthy" > /tmp/healthy
          else
            printf 'false' > /tmp/healthy
          fi

          if [[ "$(cat /tmp/healthy)" != 'true' ]]; then
            az functionapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --settings RECRUITMENT_API_ENABLED=false RECRUITMENT_CAPTURE_ONLY_MODE=false --output none
            az functionapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --output none
          fi

      - name: Record Key Vault result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          DIAGNOSE_OUTCOME: ${{ steps.diagnose.outcome }}
        run: |
          set -euo pipefail
          healthy="$(cat /tmp/healthy 2>/dev/null || printf 'false')"
          cat > recruitment-keyvault-repair-status.json <<EOF
          {
            "jobStatus": "${JOB_STATUS}",
            "login": "${LOGIN_OUTCOME}",
            "diagnose": "${DIAGNOSE_OUTCOME}",
            "healthyAfterRepair": "${healthy}",
            "sourceCommit": "${GITHUB_SHA}",
            "recordedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recruitment-keyvault-diagnostic.json recruitment-keyvault-repair-status.json 2>/dev/null || git add recruitment-keyvault-repair-status.json
          [[ -f recruitment-keyvault-repair-health.json ]] && git add recruitment-keyvault-repair-health.json
          git commit -m 'Record recruitment Key Vault repair result [skip ci]' || exit 0
          git push origin HEAD:agent/rebuild-recruitment-backend
