name: Temporary Configure Recruitment Test Secrets

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-configure-recruitment-test-secrets.yml

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP_NAME: svrc26hk-recruit-fn-test
  KEY_VAULT_NAME: svrc26hk-recruit-kv-test

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: recruitment-test
    timeout-minutes: 15
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm public and destructive controls remain disabled
        shell: bash
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP_NAME" --output json)"
          for key in RECRUITMENT_API_ENABLED RECRUITMENT_OUTBOX_DELIVERY_ENABLED RECRUITMENT_CANDIDATE_ACK_ENABLED RECRUITMENT_HR_ACCESS_ENABLED RECRUITMENT_RETENTION_ENABLED RECRUITMENT_RETENTION_DELETION_ENABLED; do
            value="$(jq -r --arg key "$key" '.[] | select(.name == $key) | .value' <<<"$settings")"
            [[ "${value,,}" == "false" ]] || { echo "$key is not disabled" >&2; exit 1; }
          done

      - name: Generate and store test secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          completion="$(openssl rand -base64 48 | tr -d '\n')"
          fingerprint="$(openssl rand -base64 48 | tr -d '\n')"
          turnstile="test-placeholder-not-enabled-$(openssl rand -hex 16)"

          az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name recruitment-completion-token-key --value "$completion" --output none
          az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name recruitment-fingerprint-key --value "$fingerprint" --output none
          az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name recruitment-turnstile-secret --value "$turnstile" --output none

          unset completion fingerprint turnstile

      - name: Verify secrets exist without reading values
        shell: bash
        run: |
          set -euo pipefail
          for name in recruitment-completion-token-key recruitment-fingerprint-key recruitment-turnstile-secret; do
            enabled="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$name" --query attributes.enabled -o tsv)"
            [[ "${enabled,,}" == "true" ]] || { echo "$name is not enabled" >&2; exit 1; }
          done

      - name: Probe Microsoft Graph access for SharePoint setup
        id: graph
        shell: bash
        run: |
          set -euo pipefail
          token="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          status="$(curl -sS -o /tmp/graph.json -w '%{http_code}' -H "Authorization: Bearer $token" 'https://graph.microsoft.com/v1.0/sites/root?$select=id,webUrl')"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" == "200" ]]; then
            echo 'Microsoft Graph SharePoint access is available.'
          else
            echo "Microsoft Graph SharePoint access is not available (HTTP $status)."
          fi

      - name: Final safety check
        shell: bash
        run: |
          set -euo pipefail
          value="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP_NAME" --query "[?name=='RECRUITMENT_API_ENABLED'].value | [0]" -o tsv)"
          [[ "${value,,}" == "false" ]] || { echo 'API changed unexpectedly' >&2; exit 1; }
          echo "Secrets configured. Graph SharePoint probe HTTP status: ${{ steps.graph.outputs.status }}"
