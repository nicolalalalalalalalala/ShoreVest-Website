name: Recruitment Functions Hotfix Deploy

on:
  push:
    branches:
      - agent/rebuild-recruitment-backend
    paths:
      - .github/workflows/recruitment-functions.yml
      - services/recruitment-functions/HOTFIX_TRIGGER.txt
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: recruitment-functions-hotfix-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: recruitment-test
    env:
      AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
      AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
      AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
      AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
      FUNCTION_APP: svrc26hk-recruit-fn-test
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: login
        name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - id: safety
        name: Verify safe live state
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(az account show --query id -o tsv)" == "$AZURE_SUBSCRIPTION_ID" ]]
          [[ "$(az account show --query tenantId -o tsv)" == "$AZURE_TENANT_ID" ]]
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          value() { jq -r --arg key "$1" '.[] | select(.name == $key) | .value' <<<"$settings" | tr '[:upper:]' '[:lower:]'; }
          [[ "$(value RECRUITMENT_HR_ACCESS_ENABLED)" == 'false' ]]
          [[ "$(value RECRUITMENT_RETENTION_ENABLED)" == 'false' ]]
          [[ "$(value RECRUITMENT_RETENTION_DELETION_ENABLED)" == 'false' ]]

      - id: package
        name: Build immutable Function package
        shell: pwsh
        run: |
          ./services/recruitment-functions/scripts/package.ps1 -CommitSha '${{ github.sha }}' -OutputPath "$env:RUNNER_TEMP/recruitment-functions.zip"

      - id: deploy
        name: Deploy Function package with backoff
        shell: bash
        run: |
          set -u
          deployed=false
          for attempt in 1 2 3 4; do
            echo "Azure Function deployment attempt $attempt of 4"
            if az functionapp deployment source config-zip \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --src "$RUNNER_TEMP/recruitment-functions.zip" \
              --build-remote false \
              --timeout 600 \
              --output none; then
              deployed=true
              break
            fi
            echo "Deployment attempt $attempt failed. Latest Azure deployment log:"
            az functionapp log deployment show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --output json || true
            sleep $((attempt * 30))
          done
          [[ "$deployed" == 'true' ]] || exit 1

      - id: index
        name: Verify required Functions indexed
        shell: bash
        run: |
          set -euo pipefail
          expected=(initiateApplication completeUpload finalizeApplication health outboxWorker)
          for attempt in $(seq 1 24); do
            names="$(az functionapp function list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --query '[].name' -o tsv 2>/dev/null | sed 's#^.*/##' || true)"
            missing=0
            for name in "${expected[@]}"; do grep -qx "$name" <<<"$names" || missing=$((missing+1)); done
            if [[ "$missing" == '0' ]]; then exit 0; fi
            echo "Index check $attempt: $missing required Functions missing."
            sleep 15
          done
          exit 1

      - id: activate
        name: Activate candidate and team notifications
        shell: bash
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          cutoff="$(jq -r '.[] | select(.name == "RECRUITMENT_OUTBOX_NOT_BEFORE_UTC") | .value' <<<"$settings" | head -n1)"
          if [[ -z "$cutoff" || "$cutoff" == 'null' ]]; then
            cutoff="$(node -e 'process.stdout.write(new Date().toISOString())')"
          fi
          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --settings \
              RECRUITMENT_API_ENABLED=true \
              RECRUITMENT_CAPTURE_ONLY_MODE=true \
              RECRUITMENT_OUTBOX_DELIVERY_ENABLED=true \
              RECRUITMENT_OUTBOX_NOT_BEFORE_UTC="$cutoff" \
              RECRUITMENT_CANDIDATE_ACK_ENABLED=true \
              RECRUITMENT_CANDIDATE_ACK_TEMPLATE_APPROVED=true \
              RECRUITMENT_CANDIDATE_ACK_MAILBOX=careers@shorevest.com \
              RECRUITMENT_CANDIDATE_ACK_PRIVACY_URL=https://shorevest.com/privacy-policy/ \
              RECRUITMENT_TEAM_NOTIFICATION_ENABLED=true \
              RECRUITMENT_TEAM_NOTIFICATION_MAILBOX=careers@shorevest.com \
              RECRUITMENT_TEAM_NOTIFICATION_RECIPIENTS=careers@shorevest.com,hr@shorevest.com \
              RECRUITMENT_HR_ACCESS_ENABLED=false \
              RECRUITMENT_RETENTION_ENABLED=false \
              RECRUITMENT_RETENTION_DELETION_ENABLED=false \
            --output none
          az functionapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --output none

      - id: health
        name: Verify live recruitment health
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "https://${FUNCTION_APP}.azurewebsites.net/api/recruitment/health" || true)"
            if [[ "$code" == '200' ]] && jq -e '.ok == true and .configuration == "valid" and .dependencies == "ready"' "$RUNNER_TEMP/health.json" >/dev/null 2>&1; then
              healthy=true
              break
            fi
            echo "Health check $attempt: HTTP $code"
            sleep 10
          done
          [[ "$healthy" == 'true' ]] || { cat "$RUNNER_TEMP/health.json" >&2 || true; exit 1; }
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          value() { jq -r --arg key "$1" '.[] | select(.name == $key) | .value' <<<"$settings" | tr '[:upper:]' '[:lower:]'; }
          [[ "$(value RECRUITMENT_OUTBOX_DELIVERY_ENABLED)" == 'true' ]]
          [[ "$(value RECRUITMENT_CANDIDATE_ACK_ENABLED)" == 'true' ]]
          [[ "$(value RECRUITMENT_TEAM_NOTIFICATION_ENABLED)" == 'true' ]]
          cp "$RUNNER_TEMP/health.json" recruitment-capture-live-health.json

      - id: diagnostic
        name: Check test application outbox delivery
        shell: bash
        run: |
          set -euo pipefail
          reference='SV-APP-2026-9997C158CF90455D'
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          export COSMOS_ENDPOINT="$(jq -r '.[] | select(.name == "RECRUITMENT_COSMOS_ENDPOINT") | .value' <<<"$settings" | head -n1)"
          export COSMOS_DATABASE="$(jq -r '.[] | select(.name == "RECRUITMENT_COSMOS_DATABASE") | .value' <<<"$settings" | head -n1)"
          export APPLICATION_REFERENCE="$reference"
          node <<'NODE'
          const { CosmosClient } = require('./services/recruitment-functions/node_modules/@azure/cosmos');
          const { AzureCliCredential } = require('./services/recruitment-functions/node_modules/@azure/identity');
          (async () => {
            const credential = new AzureCliCredential();
            const client = new CosmosClient({ endpoint: process.env.COSMOS_ENDPOINT, aadCredentials: credential });
            const container = client.database(process.env.COSMOS_DATABASE).container('submissions');
            const query = {
              query: `SELECT c.type, c.state, c.attemptCount, c.completedAtUtc, c.deliveryReference, c.lastErrorCode FROM c WHERE c.docType = 'outbox' AND c.applicationReference = @reference`,
              parameters: [{ name: '@reference', value: process.env.APPLICATION_REFERENCE }]
            };
            const { resources } = await container.items.query(query, { maxItemCount: 20 }).fetchAll();
            const sanitized = resources.map((item) => ({
              type: item.type,
              state: item.state,
              attemptCount: item.attemptCount,
              completedAtUtc: item.completedAtUtc || null,
              teamMailRecorded: String(item.deliveryReference || '').includes('team-mail:'),
              candidateMailRecorded: String(item.deliveryReference || '').includes('mail:'),
              lastErrorCode: item.lastErrorCode || null
            })).sort((a, b) => String(a.type).localeCompare(String(b.type)));
            console.log('OUTBOX_DIAGNOSTIC=' + JSON.stringify(sanitized));
            const team = sanitized.find((item) => item.type === 'ApplicationReceived');
            if (!team) throw new Error('ApplicationReceived outbox event not found');
            if (team.state !== 'Completed') throw new Error(`ApplicationReceived state is ${team.state}`);
            if (team.teamMailRecorded !== true) throw new Error('team-mail delivery reference missing');
          })().catch((error) => {
            console.error('OUTBOX_DIAGNOSTIC_ERROR=' + error.message);
            process.exit(1);
          });
          NODE

      - name: Record controlled Azure deploy
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          SAFETY_OUTCOME: ${{ steps.safety.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          INDEX_OUTCOME: ${{ steps.index.outcome }}
          ACTIVATE_OUTCOME: ${{ steps.activate.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          set -euo pipefail
          cat > recruitment-capture-ci-deployment-status.json <<EOF
          {
            "status": "${JOB_STATUS}",
            "sourceCommit": "${GITHUB_SHA}",
            "recordedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "steps": {
              "checkout": "${CHECKOUT_OUTCOME}",
              "azureLogin": "${LOGIN_OUTCOME}",
              "safety": "${SAFETY_OUTCOME}",
              "package": "${PACKAGE_OUTCOME}",
              "deploy": "${DEPLOY_OUTCOME}",
              "index": "${INDEX_OUTCOME}",
              "activateNotifications": "${ACTIVATE_OUTCOME}",
              "health": "${HEALTH_OUTCOME}"
            }
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recruitment-capture-ci-deployment-status.json
          [[ -f recruitment-capture-live-health.json ]] && git add recruitment-capture-live-health.json
          git commit -m 'Record controlled recruitment Azure deploy [skip ci]' || exit 0
          git push origin HEAD:agent/rebuild-recruitment-backend
