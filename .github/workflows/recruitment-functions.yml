name: Recruitment Functions CI
on:
  push:
    branches:
      - 'agent/**'
    paths:
      - '.github/workflows/recruitment-functions.yml'
      - '.github/workflows/recruitment-test-foundation-deploy.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/validate-recruitment-roles.js'
      - 'scripts/generate-clean-public-urls.js'
      - 'services/recruitment-functions/**'
      - 'api/recruitment/**'
      - 'infra/recruitment/**'
      - 'assets/data/recruitment/**'
      - 'assets/js/recruitment-*.js'
      - 'assets/js/site-config.js'
      - 'assets/css/recruitment-application.css'
      - 'careers.html'
      - 'careers_cn.html'
      - 'careers/**'
      - 'cn/careers/**'
      - 'sitemap.xml'
      - '_headers'
      - 'tests/recruitment*.test.js'
      - 'tests/security-headers.test.js'
  pull_request:
    paths:
      - '.github/workflows/recruitment-functions.yml'
      - '.github/workflows/recruitment-test-foundation-deploy.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/validate-recruitment-roles.js'
      - 'scripts/generate-clean-public-urls.js'
      - 'services/recruitment-functions/**'
      - 'api/recruitment/**'
      - 'infra/recruitment/**'
      - 'assets/data/recruitment/**'
      - 'assets/js/recruitment-*.js'
      - 'assets/js/site-config.js'
      - 'assets/css/recruitment-application.css'
      - 'careers.html'
      - 'careers_cn.html'
      - 'careers/**'
      - 'cn/careers/**'
      - 'sitemap.xml'
      - '_headers'
      - 'tests/recruitment*.test.js'
      - 'tests/security-headers.test.js'
  workflow_dispatch:
permissions:
  id-token: write
  contents: write
concurrency:
  group: recruitment-functions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install recruitment function dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/recruitment-functions
      - run: npm run validate:recruitment
      - run: npm run check:recruitment
      - run: npm run test:recruitment
      - run: npm run check:security
      - run: npm run check:functions
      - run: npm run test:functions
      - name: Build and verify immutable Function package
        shell: pwsh
        run: |
          $artifact = 'artifacts/recruitment-functions.zip'
          & ./services/recruitment-functions/scripts/package.ps1 `
            -CommitSha '${{ github.sha }}' `
            -OutputPath $artifact

          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw 'Recruitment Function archive was not created.'
          }
          if (-not (Test-Path -LiteralPath "$artifact.sha256" -PathType Leaf)) {
            throw 'Recruitment Function archive digest sidecar was not created.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $artifact))
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($required in @(
              'host.json',
              'package.json',
              'deployment-metadata.json',
              'services/recruitment-functions/package.json',
              'services/recruitment-functions/src/functions/index.js',
              'api/recruitment/core/flows.js',
              'assets/data/recruitment/roles.v1.json',
              'services/recruitment-functions/node_modules/@azure/functions/package.json'
            )) {
              if ($entries -notcontains $required) {
                throw "Package is missing required entry: $required"
              }
            }
            if ($entries | Where-Object { $_ -match '^(staging|recruitment-functions)/' }) {
              throw 'Package contains a forbidden wrapper directory.'
            }
            if ($entries | Where-Object { $_ -match '(^|/)(local\.settings|\.env)' }) {
              throw 'Package contains forbidden local configuration.'
            }

            $packageEntry = $archive.GetEntry('package.json')
            $packageReader = [System.IO.StreamReader]::new($packageEntry.Open())
            try {
              $deploymentPackage = ($packageReader.ReadToEnd() | ConvertFrom-Json)
            } finally {
              $packageReader.Dispose()
            }
            if ($deploymentPackage.main -ne 'services/recruitment-functions/src/functions/index.js') {
              throw 'Deployment package main entry does not preserve the Function service layout.'
            }

            $metadataEntry = $archive.GetEntry('deployment-metadata.json')
            $reader = [System.IO.StreamReader]::new($metadataEntry.Open())
            try {
              $metadata = ($reader.ReadToEnd() | ConvertFrom-Json)
            } finally {
              $reader.Dispose()
            }
            if ($metadata.sourceCommit -ne '${{ github.sha }}') {
              throw 'Deployment metadata commit does not match the workflow head.'
            }
            if ($metadata.payloadSha256 -notmatch '^[0-9a-f]{64}$') {
              throw 'Deployment metadata payload digest is invalid.'
            }
            if ($metadata.archiveSha256Sidecar -ne 'recruitment-functions.zip.sha256') {
              throw 'Deployment metadata sidecar name is invalid.'
            }
          } finally {
            $archive.Dispose()
          }

          $actualHash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          $recordedHash = ((Get-Content -LiteralPath "$artifact.sha256" -Raw).Trim() -split '\s+')[0]
          if ($actualHash -ne $recordedHash) {
            throw 'Archive digest sidecar does not match the generated ZIP.'
          }
      - name: Check Azure deployment shell syntax
        run: |
          bash -n infra/recruitment/bootstrap-github-oidc.sh
          bash -n infra/recruitment/deploy-test-foundation-cloudshell.sh
      - name: Compile recruitment Bicep
        run: npm run bicep:build:recruitment
      - name: Compile ShoreVest test Bicep parameters
        run: az bicep build-params --file infra/recruitment/test-eastasia.bicepparam --stdout >/dev/null
      - name: Lint recruitment Bicep
        run: npm run bicep:lint:recruitment
      - run: git diff --check

  deploy_capture:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/rebuild-recruitment-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: recruitment-test
    env:
      AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
      AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
      AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
      AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
      FUNCTION_APP: svrc26hk-recruit-fn-test
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/recruitment-functions/package-lock.json

      - id: login
        name: Sign in to Azure with bootstrapped OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - id: safety
        name: Verify capture safety state before deployment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(az account show --query id -o tsv)" == "$AZURE_SUBSCRIPTION_ID" ]]
          [[ "$(az account show --query tenantId -o tsv)" == "$AZURE_TENANT_ID" ]]
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          value() { jq -r --arg key "$1" '.[] | select(.name == $key) | .value' <<<"$settings" | tr '[:upper:]' '[:lower:]'; }
          [[ "$(value RECRUITMENT_API_ENABLED)" == 'true' ]] || { echo 'Public capture API is not currently enabled.' >&2; exit 1; }
          [[ "$(value RECRUITMENT_CAPTURE_ONLY_MODE)" == 'true' ]] || { echo 'Capture-only mode is not currently enabled.' >&2; exit 1; }
          for key in RECRUITMENT_HR_ACCESS_ENABLED RECRUITMENT_RETENTION_ENABLED RECRUITMENT_RETENTION_DELETION_ENABLED; do
            [[ "$(value "$key")" == 'false' ]] || { echo "$key must remain false." >&2; exit 1; }
          done

      - id: manifest
        name: Verify approved online application roles
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const m = require('./assets/data/recruitment/roles.v1.json');
          const enabled = m.roles.filter(r => r.application && r.application.enabled === true);
          const ids = enabled.map(r => r.id).sort();
          const expected = ['distressed-debt-investment-manager', 'legal-assistant'];
          if (JSON.stringify(ids) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected enabled application roles: ${ids.join(', ')}`);
          }
          if (enabled.some(r => r.application.privacyNoticeVersion !== '2026-08-08-v1')) {
            throw new Error('An enabled role does not use the approved recruitment privacy version');
          }
          console.log('Both approved public roles accept the secure online application flow.');
          NODE

      - id: package
        name: Build immutable Function package
        shell: pwsh
        run: |
          ./services/recruitment-functions/scripts/package.ps1 -CommitSha '${{ github.sha }}' -OutputPath "$env:RUNNER_TEMP/recruitment-functions.zip"

      - id: deploy
        name: Deploy Function package before changing notification flags
        shell: bash
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --src "$RUNNER_TEMP/recruitment-functions.zip" \
            --build-remote false \
            --timeout 600 \
            --output none

      - id: index
        name: Verify required Functions indexed
        shell: bash
        run: |
          set -euo pipefail
          expected=(initiateApplication completeUpload finalizeApplication health outboxWorker)
          for attempt in $(seq 1 24); do
            names="$(az functionapp function list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" --query '[].name' -o tsv 2>/dev/null | sed 's#^.*/##' || true)"
            missing=0
            for name in "${expected[@]}"; do grep -qx "$name" <<<"$names" || missing=$((missing+1)); done
            if [[ "$missing" == 0 ]]; then exit 0; fi
            echo "Index check $attempt: $missing required Functions missing."
            sleep 15
          done
          exit 1

      - id: activate_notifications
        name: Enable candidate and Careers mailbox notifications
        shell: bash
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          current_cutoff="$(jq -r '.[] | select(.name == "RECRUITMENT_OUTBOX_NOT_BEFORE_UTC") | .value' <<<"$settings" | head -n1)"
          if [[ -z "$current_cutoff" || "$current_cutoff" == 'null' ]]; then
            current_cutoff="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --settings \
              RECRUITMENT_API_ENABLED=true \
              RECRUITMENT_CAPTURE_ONLY_MODE=true \
              RECRUITMENT_OUTBOX_DELIVERY_ENABLED=true \
              RECRUITMENT_OUTBOX_NOT_BEFORE_UTC="$current_cutoff" \
              RECRUITMENT_CANDIDATE_ACK_ENABLED=true \
              RECRUITMENT_CANDIDATE_ACK_TEMPLATE_APPROVED=true \
              RECRUITMENT_CANDIDATE_ACK_MAILBOX=careers@shorevest.com \
              RECRUITMENT_CANDIDATE_ACK_PRIVACY_URL=https://shorevest.com/privacy-policy/ \
              RECRUITMENT_TEAM_NOTIFICATION_ENABLED=true \
              RECRUITMENT_TEAM_NOTIFICATION_MAILBOX=careers@shorevest.com \
              RECRUITMENT_HR_ACCESS_ENABLED=false \
              RECRUITMENT_RETENTION_ENABLED=false \
              RECRUITMENT_RETENTION_DELETION_ENABLED=false \
            --output none
          az functionapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP"
          echo "Notification activation cutoff: $current_cutoff"

      - id: health
        name: Verify live capture plus notification health and safety
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 24); do
            code="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "https://${FUNCTION_APP}.azurewebsites.net/api/recruitment/health" || true)"
            if [[ "$code" == '200' ]] && jq -e '.ok == true and .configuration == "valid" and .dependencies == "ready"' "$RUNNER_TEMP/health.json" >/dev/null 2>&1; then
              healthy=true
              break
            fi
            echo "Health check $attempt: HTTP $code"
            sleep 10
          done
          if [[ "$healthy" != 'true' ]]; then
            echo 'Notification-enabled runtime failed health. Reverting notification delivery while preserving capture.' >&2
            cat "$RUNNER_TEMP/health.json" >&2 || true
            az functionapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNCTION_APP" \
              --settings \
                RECRUITMENT_API_ENABLED=true \
                RECRUITMENT_CAPTURE_ONLY_MODE=true \
                RECRUITMENT_OUTBOX_DELIVERY_ENABLED=false \
                RECRUITMENT_CANDIDATE_ACK_ENABLED=false \
                RECRUITMENT_TEAM_NOTIFICATION_ENABLED=false \
                RECRUITMENT_HR_ACCESS_ENABLED=false \
                RECRUITMENT_RETENTION_ENABLED=false \
                RECRUITMENT_RETENTION_DELETION_ENABLED=false \
              --output none || true
            az functionapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" || true
            exit 1
          fi
          settings="$(az functionapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP" -o json)"
          value() { jq -r --arg key "$1" '.[] | select(.name == $key) | .value' <<<"$settings" | tr '[:upper:]' '[:lower:]'; }
          [[ "$(value RECRUITMENT_API_ENABLED)" == 'true' ]]
          [[ "$(value RECRUITMENT_CAPTURE_ONLY_MODE)" == 'true' ]]
          [[ "$(value RECRUITMENT_OUTBOX_DELIVERY_ENABLED)" == 'true' ]]
          [[ "$(value RECRUITMENT_CANDIDATE_ACK_ENABLED)" == 'true' ]]
          [[ "$(value RECRUITMENT_CANDIDATE_ACK_TEMPLATE_APPROVED)" == 'true' ]]
          [[ "$(value RECRUITMENT_TEAM_NOTIFICATION_ENABLED)" == 'true' ]]
          [[ "$(value RECRUITMENT_HR_ACCESS_ENABLED)" == 'false' ]]
          [[ "$(value RECRUITMENT_RETENTION_ENABLED)" == 'false' ]]
          [[ "$(value RECRUITMENT_RETENTION_DELETION_ENABLED)" == 'false' ]]
          cp "$RUNNER_TEMP/health.json" recruitment-capture-live-health.json

      - name: Record Azure deployment result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          OUT_LOGIN: ${{ steps.login.outcome }}
          OUT_SAFETY: ${{ steps.safety.outcome }}
          OUT_MANIFEST: ${{ steps.manifest.outcome }}
          OUT_PACKAGE: ${{ steps.package.outcome }}
          OUT_DEPLOY: ${{ steps.deploy.outcome }}
          OUT_INDEX: ${{ steps.index.outcome }}
          OUT_ACTIVATE: ${{ steps.activate_notifications.outcome }}
          OUT_HEALTH: ${{ steps.health.outcome }}
        run: |
          set -euo pipefail
          cat > recruitment-capture-ci-deployment-status.json <<EOF
          {
            "status": "${JOB_STATUS}",
            "sourceCommit": "${GITHUB_SHA}",
            "recordedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "steps": {
              "azureLogin": "${OUT_LOGIN}",
              "safety": "${OUT_SAFETY}",
              "manifest": "${OUT_MANIFEST}",
              "package": "${OUT_PACKAGE}",
              "deploy": "${OUT_DEPLOY}",
              "index": "${OUT_INDEX}",
              "activateNotifications": "${OUT_ACTIVATE}",
              "health": "${OUT_HEALTH}"
            }
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recruitment-capture-ci-deployment-status.json recruitment-capture-live-health.json 2>/dev/null || git add recruitment-capture-ci-deployment-status.json
          git commit -m 'Record controlled recruitment Azure deploy [skip ci]' || exit 0
          git push origin HEAD:agent/rebuild-recruitment-backend
