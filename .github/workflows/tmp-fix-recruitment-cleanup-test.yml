name: Temporary fix recruitment cleanup test

on:
  push:
    branches:
      - agent/recruitment-frontend-launch
    paths:
      - .github/workflows/tmp-fix-recruitment-cleanup-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recruitment-frontend-launch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch cleanup test contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/recruitment-phase2a2.test.js')
          s = p.read_text(encoding='utf-8')
          old = "retryQuarantineCleanup({fileReference:init.fileReference},createMemoryAdapters({manifest:manifest(),backing}))"
          new = "retryQuarantineCleanup({applicationReference:init.applicationReference,fileReference:init.fileReference},createMemoryAdapters({manifest:manifest(),backing}))"
          if old not in s:
              if new in s:
                  print('Cleanup test already updated')
              else:
                  raise SystemExit('Expected cleanup test call not found')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          npm ci --ignore-scripts
          node tests/recruitment-phase2a2.test.js
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "shorevest-recruitment-bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/tmp-fix-recruitment-cleanup-test.yml
          git add tests/recruitment-phase2a2.test.js .github/workflows/tmp-fix-recruitment-cleanup-test.yml
          git commit -m "Update quarantine cleanup regression test contract"
          git push origin HEAD:agent/recruitment-frontend-launch
